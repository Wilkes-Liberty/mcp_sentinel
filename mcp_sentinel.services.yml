services:
  logger.channel.mcp_sentinel:
    parent: logger.channel_base
    arguments:
      - 'mcp_sentinel'

  logger.channel.mcp_sentinel_audit:
    parent: logger.channel_base
    arguments:
      - 'mcp_sentinel_audit'

  mcp_sentinel.audit_logger:
    class: Drupal\mcp_sentinel\Service\McpAuditLogger
    arguments:
      - '@config.factory'
      - '@request_stack'
      # Optional at compile time so the container still builds when audit_chain
      # is not yet enabled. A required reference here made the 2.0.0 upgrade
      # unrecoverable: the code landed before `drush updatedb` could install the
      # dependency, the container would not compile, and drush could not run to
      # fix it because drush needs the same container. McpAuditLogger fails
      # closed at runtime instead — it never records nothing quietly.
      - '@?audit_chain.logger'
      - '@mcp_sentinel.dlp'
      # Transaction awareness: refusal evidence written inside an aborting
      # entity-save transaction must survive its rollback.
      - '@database'
      # Optional so a missing bundle registry cannot break the 2.0.0-style
      # container compile path the audit_chain argument already protects.
      - '@?mcp_sentinel.policy_bundle_registry'

  mcp_sentinel.policy_bundle_registry:
    class: Drupal\mcp_sentinel\Service\McpPolicyBundleRegistry
    arguments:
      - '@config.factory'
      - '@state'
      - '@datetime.time'
      - '@uuid'
      - '@?key.repository'
      - '@cache_tags.invalidator'

  mcp_sentinel.policy_resolver:
    class: Drupal\mcp_sentinel\Service\McpPolicyResolver
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@current_user'
      - '@mcp_sentinel.oauth_context'

  mcp_sentinel.access_checker:
    class: Drupal\mcp_sentinel\Service\McpAccessChecker
    arguments:
      - '@config.factory'
      - '@request_stack'
      - '@entity_type.manager'
      - '@mcp_sentinel.classification'
      - '@?mcp_sentinel.policy_bundle_registry'

  mcp_sentinel.moderation_gate:
    class: Drupal\mcp_sentinel\Service\McpModerationGate
    arguments:
      # Optional: NULL when the Content Moderation module is not installed.
      - '@?content_moderation.moderation_information'

  mcp_sentinel.pinned_composite_locator:
    class: Drupal\mcp_sentinel\Service\McpPinnedCompositeLocator
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@mcp_sentinel.moderation_gate'

  mcp_sentinel.composite_redirect:
    class: Drupal\mcp_sentinel\Service\McpCompositeRedirect
    arguments:
      - '@mcp_sentinel.policy_resolver'
      - '@mcp_sentinel.pinned_composite_locator'
      - '@mcp_sentinel.moderation_gate'
      - '@entity_type.manager'
      - '@current_route_match'
      - '@mcp_sentinel.audit_logger'
      - '@logger.channel.mcp_sentinel'
      # Optional: NULL when the Content Moderation module is not installed.
      - '@?content_moderation.moderation_information'

  mcp_sentinel.write_preconditions:
    class: Drupal\mcp_sentinel\Service\McpWritePreconditions
    arguments:
      - '@mcp_sentinel.policy_resolver'
      - '@mcp_sentinel.content_lock'
      - '@entity_type.manager'

  # Evidence-required action veto (d.o #3616539). Both chain and key
  # references are optional for the same container-compilation reason as the
  # audit logger's: their absence is a veto condition the guard reports, not a
  # wiring error that takes the site down.
  mcp_sentinel.action_manifest_sealer:
    class: Drupal\mcp_sentinel\Service\McpActionManifestSealer
    arguments:
      - '@config.factory'
      - '@?key.repository'
      - '@mcp_sentinel.oauth_context'
      - '@request_stack'
      - '@datetime.time'
      - '@uuid'

  mcp_sentinel.evidence_guard:
    class: Drupal\mcp_sentinel\Service\McpEvidenceGuard
    arguments:
      - '@config.factory'
      - '@?audit_chain.logger'
      - '@?key.repository'
      - '@mcp_sentinel.audit_logger'
      - '@uuid'
      - '@current_user'
      - '@keyvalue'
      - '@datetime.time'
      - '@mcp_sentinel.oauth_context'
      - '@request_stack'
      - '@database'

  mcp_sentinel.unmoderated_redirect:
    class: Drupal\mcp_sentinel\Service\McpUnmoderatedForwardRevision
    arguments:
      - '@mcp_sentinel.policy_resolver'
      - '@mcp_sentinel.moderation_gate'
      - '@entity_type.manager'
      - '@mcp_sentinel.audit_logger'
      - '@current_user'
      - '@datetime.time'
      # Optional: NULL when the Content Moderation module is not installed.
      - '@?content_moderation.moderation_information'

  mcp_sentinel.webhook_queue_manager:
    class: Drupal\mcp_sentinel\Service\McpWebhookQueueManager
    arguments:
      - '@config.factory'
      - '@queue'
      - '@database'
      - '@datetime.time'
      - '@logger.channel.mcp_sentinel'

  mcp_sentinel.event_dispatcher:
    class: Drupal\mcp_sentinel\Service\McpEventDispatcher
    arguments:
      - '@event_dispatcher'
      - '@config.factory'
      - '@datetime.time'
      - '@mcp_sentinel.webhook_queue_manager'

  mcp_sentinel.oauth_context:
    class: Drupal\mcp_sentinel\Service\McpOauthContext
    arguments:
      - '@current_user'
      - '@config.factory'

  mcp_sentinel.install_verifier:
    class: Drupal\mcp_sentinel\Service\McpInstallVerifier
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@module_handler'
      - '@extension.list.module'
      - '@mcp_sentinel.governance_readiness'
      - '@mcp_sentinel.role_assertions'
      - '@mcp_sentinel.read_budgets'
      - '@mcp_sentinel.evidence_guard'
      - '@mcp_sentinel.classification'
      - '@mcp_sentinel.policy_resolver'
      - '@mcp_sentinel.access_checker'
      - '@mcp_sentinel.oauth_context'
      - '@mcp_sentinel.unmoderated_redirect'
      - '@current_user'
      - '@datetime.time'
      - '@mcp_sentinel.jsonapi_page_limit_subscriber'
      - '@mcp_sentinel.audit_logger'
      - '@database'
      # Optional: NULL when Content Moderation is not installed.
      - '@?content_moderation.moderation_information'

  mcp_sentinel.governance_readiness:
    class: Drupal\mcp_sentinel\Service\McpGovernanceReadiness
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@module_handler'
      - '@mcp_sentinel.policy_resolver'
      - '@mcp_sentinel.oauth_context'
      - '@?audit_chain.logger'
      # Optional at container-build time so an incomplete upgrade can still
      # run requirements/update tooling. Readiness returns
      # tool_registration_missing rather than letting the container fail.
      - '@?plugin.manager.tool'

  mcp_sentinel.dlp:
    class: Drupal\mcp_sentinel\Service\McpDlp
    factory: 'Drupal\mcp_sentinel\Service\McpDlp::createFromConfig'
    arguments:
      - '@config.factory'
      - '@logger.channel.mcp_sentinel'

  mcp_sentinel.classification:
    class: Drupal\mcp_sentinel\Service\McpClassificationResolver
    arguments:
      - '@config.factory'
      - '@request_stack'
      # Origin evidence reads the environment name from settings.php
      # ($settings['mcp_sentinel.environment']), never from config.
      - '@settings'
      - '@mcp_sentinel.audit_logger'

  mcp_sentinel.read_budgets:
    class: Drupal\mcp_sentinel\Service\McpReadBudgetResolver
    arguments:
      - '@config.factory'

  mcp_sentinel.rate_limiter:
    class: Drupal\mcp_sentinel\Service\McpRateLimiter
    arguments:
      - '@flood'
      - '@mcp_sentinel.read_budgets'

  mcp_sentinel.exfiltration_guard:
    class: Drupal\mcp_sentinel\Service\McpExfiltrationGuard
    arguments:
      - '@mcp_sentinel.read_budgets'

  mcp_sentinel.raw_sql_guard:
    class: Drupal\mcp_sentinel\Service\McpRawSqlGuard
    arguments:
      - '@entity_type.manager'
      - '@mcp_sentinel.classification'
      - '@?mcp_sentinel.policy_bundle_registry'

  mcp_sentinel.jsonapi_page_limit_subscriber:
    class: Drupal\mcp_sentinel\EventSubscriber\McpJsonApiPageLimitSubscriber
    arguments:
      - '@mcp_sentinel.access_checker'
      - '@mcp_sentinel.governance_readiness'
      - '@current_user'
      - '@mcp_sentinel.rate_limiter'
      - '@mcp_sentinel.read_budgets'
      - '@mcp_sentinel.audit_logger'
      - '@mcp_sentinel.classification'
    tags:
      - { name: event_subscriber }

  mcp_sentinel.governed_response_subscriber:
    class: Drupal\mcp_sentinel\EventSubscriber\McpGovernedResponseSubscriber
    arguments:
      - '@mcp_sentinel.governance_readiness'
      - '@current_user'
      - '@mcp_sentinel.exfiltration_guard'
      - '@mcp_sentinel.audit_logger'
      - '@mcp_sentinel.classification'
      # Optional: kernel tests boot the module without jsonapi; the seam then
      # never re-types a body (there is no JSON:API to serve one).
      - '@?jsonapi.resource_type.repository'
    tags:
      - { name: event_subscriber }

  mcp_sentinel.config_save_subscriber:
    class: Drupal\mcp_sentinel\EventSubscriber\McpConfigSaveSubscriber
    arguments:
      - '@mcp_sentinel.policy_resolver'
      - '@mcp_sentinel.audit_logger'
      - '@config.factory'
      - '@config.storage'
      - '@mcp_sentinel.role_assertions'
      - '@logger.channel.mcp_sentinel'
    tags:
      - { name: event_subscriber }

  mcp_sentinel.readiness_access_denied_subscriber:
    class: Drupal\mcp_sentinel\EventSubscriber\McpReadinessAccessDeniedSubscriber
    arguments:
      - '@current_user'
    tags:
      - { name: event_subscriber }

  mcp_sentinel.anomaly_detector:
    class: Drupal\mcp_sentinel\Service\McpAnomalyDetector
    arguments:
      - '@database'
      - '@config.factory'
      - '@state'
      - '@datetime.time'
      - '@entity_type.manager'

  mcp_sentinel.anomaly_alert_dispatcher:
    class: Drupal\mcp_sentinel\Service\McpAlertDispatcher
    arguments:
      - '@config.factory'
      - '@logger.channel.mcp_sentinel'
      - '@plugin.manager.mail'
      - '@mcp_sentinel.webhook_queue_manager'
      - '@language_manager'
      - '@mcp_sentinel.audit_logger'

  mcp_sentinel.content_lock:
    class: Drupal\mcp_sentinel\Service\McpContentLock
    arguments:
      - '@database'
      - '@current_user'
      - '@datetime.time'

  mcp_sentinel.metrics:
    class: Drupal\mcp_sentinel\Service\McpMetrics
    arguments:
      - '@database'
      - '@config.factory'
      - '@state'
      - '@datetime.time'
      - '@entity_type.manager'
      - '@mcp_sentinel.audit_logger'
      - '@logger.channel.mcp_sentinel'

  mcp_sentinel.role_assertions:
    class: Drupal\mcp_sentinel\Service\McpRoleAssertions
    arguments:
      - '@entity_type.manager'
      - '@mcp_sentinel.policy_resolver'
      # Environment name for scoped acknowledgements comes from settings.php
      # ($settings['mcp_sentinel.environment']), never from config.
      - '@settings'

  mcp_sentinel.urgent_conditions:
    class: Drupal\mcp_sentinel\Service\McpUrgentConditions
    arguments:
      - '@config.factory'
      - '@state'
      - '@database'
      - '@datetime.time'
      - '@entity_type.manager'
      - '@key.repository'
      - '@mcp_sentinel.role_assertions'

  mcp_sentinel.chart_renderer:
    class: Drupal\mcp_sentinel\Service\McpChartRenderer
    arguments:
      - '@module_handler'
