services:
  logger.channel.mcp_sentinel:
    parent: logger.channel_base
    arguments:
      - 'mcp_sentinel'

  logger.channel.mcp_sentinel_audit:
    parent: logger.channel_base
    arguments:
      - 'mcp_sentinel_audit'

  mcp_sentinel.audit_logger:
    class: Drupal\mcp_sentinel\Service\McpAuditLogger
    arguments:
      - '@database'
      - '@current_user'
      - '@request_stack'
      - '@config.factory'
      - '@datetime.time'
      - '@key.repository'
      - '@lock'
      - '@logger.channel.mcp_sentinel_audit'
      - '@encryption'
      - '@entity_type.manager'
      - '@mcp_sentinel.dlp'

  mcp_sentinel.policy_resolver:
    class: Drupal\mcp_sentinel\Service\McpPolicyResolver
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@current_user'
      - '@mcp_sentinel.oauth_context'

  mcp_sentinel.access_checker:
    class: Drupal\mcp_sentinel\Service\McpAccessChecker
    arguments:
      - '@config.factory'

  mcp_sentinel.event_dispatcher:
    class: Drupal\mcp_sentinel\Service\McpEventDispatcher
    arguments:
      - '@event_dispatcher'
      - '@config.factory'
      - '@logger.channel.mcp_sentinel'
      - '@http_client'
      - '@datetime.time'
      - '@key.repository'

  mcp_sentinel.oauth_context:
    class: Drupal\mcp_sentinel\Service\McpOauthContext
    arguments:
      - '@current_user'
      - '@config.factory'

  mcp_sentinel.dlp:
    class: Drupal\mcp_sentinel\Service\McpDlp
    factory: 'Drupal\mcp_sentinel\Service\McpDlp::createFromConfig'
    arguments:
      - '@config.factory'
      - '@logger.channel.mcp_sentinel'

  mcp_sentinel.rate_limiter:
    class: Drupal\mcp_sentinel\Service\McpRateLimiter
    arguments:
      - '@flood'

  mcp_sentinel.exfiltration_guard:
    class: Drupal\mcp_sentinel\Service\McpExfiltrationGuard

  mcp_sentinel.jsonapi_page_limit_subscriber:
    class: Drupal\mcp_sentinel\EventSubscriber\McpJsonApiPageLimitSubscriber
    arguments:
      - '@mcp_sentinel.policy_resolver'
    tags:
      - { name: event_subscriber }

  mcp_sentinel.content_lock:
    class: Drupal\mcp_sentinel\Service\McpContentLock
    arguments:
      - '@database'
      - '@current_user'
      - '@datetime.time'
