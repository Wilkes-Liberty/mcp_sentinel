mcp_sentinel.settings:
  path: '/admin/config/services/mcp-sentinel'
  defaults:
    _form: '\Drupal\mcp_sentinel\Form\McpSettingsForm'
    _title: 'MCP Sentinel Settings'
  requirements:
    _permission: 'administer mcp sentinel'

mcp_sentinel.dashboard:
  path: '/admin/reports/mcp-sentinel'
  defaults:
    _controller: '\Drupal\mcp_sentinel\Controller\McpDashboardController::dashboard'
    _title: 'MCP Sentinel'
  requirements:
    _permission: 'view mcp sentinel audit log'

mcp_sentinel.banner_dismiss:
  path: '/admin/reports/mcp-sentinel/banner-dismiss'
  defaults:
    _controller: '\Drupal\mcp_sentinel\Controller\McpBannerController::dismiss'
  methods: [GET, POST]
  requirements:
    _permission: 'view mcp sentinel audit log'
    _csrf_token: 'TRUE'

mcp_sentinel.verify_chain:
  path: '/admin/reports/mcp-sentinel/verify'
  defaults:
    _controller: '\Drupal\mcp_sentinel\Controller\McpDashboardController::verify'
    _title: 'Verify audit chain'
  requirements:
    _permission: 'administer mcp sentinel'
    _csrf_token: 'TRUE'

mcp_sentinel.audit_log:
  path: '/admin/reports/mcp-sentinel/audit'
  defaults:
    _controller: '\Drupal\mcp_sentinel\Controller\McpAuditController::listing'
    _title: 'MCP Sentinel Audit Log'
  requirements:
    _permission: 'view mcp sentinel audit log'

mcp_sentinel.audit_export:
  path: '/admin/reports/mcp-sentinel/export'
  defaults:
    _controller: '\Drupal\mcp_sentinel\Controller\McpAuditController::export'
    _title: 'MCP Sentinel Audit Export'
  requirements:
    _permission: 'view mcp sentinel audit log'

mcp_sentinel.webhook_delivery:
  path: '/admin/reports/mcp-sentinel/webhooks'
  defaults:
    _controller: '\Drupal\mcp_sentinel\Controller\McpWebhookDeliveryController::listing'
    _title: 'MCP Sentinel webhook delivery log'
  requirements:
    _permission: 'administer mcp sentinel'

mcp_sentinel.webhook_replay:
  path: '/admin/reports/mcp-sentinel/webhooks/{delivery}/replay'
  defaults:
    _controller: '\Drupal\mcp_sentinel\Controller\McpWebhookDeliveryController::replay'
    _title: 'Replay webhook delivery'
  requirements:
    _permission: 'administer mcp sentinel'
    _csrf_token: 'TRUE'
    delivery: \d+

mcp_sentinel.context:
  path: '/drupal-mcp/context'
  defaults:
    _controller: '\Drupal\mcp_sentinel\Controller\McpContextController::context'
    _title: 'MCP Context'
  requirements:
    _permission: 'access mcp sentinel context'
  options:
    _auth:
      - oauth2

mcp_sentinel.health:
  path: '/drupal-mcp/health'
  defaults:
    _controller: '\Drupal\mcp_sentinel\Controller\McpContextController::health'
  requirements:
    # Public, unauthenticated uptime probe: returns only an ok/disabled status
    # and the module name (no data), so it is intentionally left unrestricted.
    _access: 'TRUE'
