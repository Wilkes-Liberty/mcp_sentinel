mcp_sentinel.settings:
  type: config_object
  label: 'MCP Sentinel settings'
  mapping:
    enabled:
      type: boolean
      label: 'MCP access enabled'
    governed_roles:
      type: sequence
      label: 'Governed roles'
      sequence:
        type: string
    audit_enabled:
      type: boolean
      label: 'Audit logging enabled'
    audit_log_reads:
      type: boolean
      label: 'Log read operations'
    audit_retention_days:
      type: integer
      label: 'Audit log retention in days'
    webhook_enabled:
      type: boolean
      label: 'Webhooks enabled'
    webhook_url:
      type: string
      label: 'Webhook URL'
    webhook_secret:
      type: string
      label: 'Webhook signing secret (deprecated; migrated to webhook_secret_key)'
    webhook_secret_key:
      type: string
      label: 'Webhook signing secret — Key entity ID'
    webhook_delivery_retention_days:
      type: integer
      label: 'Webhook delivery log retention in days (0 = forever)'
    allow_internal_webhook_urls:
      type: boolean
      label: 'Allow webhook URLs resolving to internal IP ranges (deprecated — use per-endpoint allow_internal)'
    webhook_endpoints:
      type: sequence
      label: 'Webhook endpoints'
      sequence:
        type: mapping
        label: 'Webhook endpoint'
        mapping:
          id:
            type: string
            label: 'Machine ID'
          label:
            type: string
            label: 'Label'
          url:
            type: string
            label: 'HTTPS endpoint URL'
          secret_key:
            type: string
            label: 'Key entity ID for signing secret'
          events:
            type: sequence
            label: 'Event filter (empty = all)'
            sequence:
              type: string
          enabled:
            type: boolean
            label: 'Endpoint enabled'
          allow_internal:
            type: boolean
            label: 'Allow internal/private IP (internal or VPN endpoints only; HTTPS still required)'
    agent_oauth_clients:
      type: sequence
      label: 'Agent OAuth client IDs (consumer client_id values)'
      sequence:
        type: string
    agent_provision_tiers:
      type: sequence
      label: 'Declared agent principals ("<tier>:<env>") reconciled by mcp-sentinel:agent-reconcile'
      sequence:
        type: string
    agent_scopes:
      type: sequence
      label: 'Scopes that mark the agent channel'
      sequence:
        type: string
    governed_role_fallback:
      type: boolean
      label: 'Treat governed roles as governed even without an OAuth agent token (local dev)'
    require_finite_read_budgets:
      type: boolean
      label: 'Clamp unlimited (0) read-budget values to the finite defaults (disable = explicit non-production override)'
    read_budget_defaults:
      type: mapping
      label: 'Finite defaults applied when a profile budget is unlimited (0)'
      mapping:
        results:
          type: integer
          label: 'Default max result items per request'
        bytes:
          type: integer
          label: 'Default max response bytes'
        requests:
          type: integer
          label: 'Default max governed requests per window'
        request_window:
          type: integer
          label: 'Request budget window in seconds'
        pages:
          type: integer
          label: 'Default max collection pages per window'
        page_window:
          type: integer
          label: 'Page budget window in seconds'
    classification_labels:
      type: sequence
      label: 'Ordered classification vocabulary, lowest label first'
      sequence:
        type: string
        label: 'Classification label'
    classification_map:
      type: sequence
      label: 'Classification assignments (entity type, optional bundle, optional field)'
      sequence:
        type: mapping
        label: 'Classification assignment'
        mapping:
          entity_type:
            type: string
            label: 'Entity type ID'
          bundle:
            type: string
            label: 'Bundle (empty = every bundle)'
          field:
            type: string
            label: 'Field name (empty = the entity itself)'
          label:
            type: string
            label: 'Classification label'
    context_schema_label:
      type: string
      label: 'Classification label of the schema documents served by the context endpoint and site-context tool'
    # audit_hash_key, siem_enabled and audit_encryption_profile lived here
    # until 2.0.0, then moved to audit_chain.settings. They are intentionally
    # absent from this schema so a leftover copy cannot pass config validation
    # as if it were still live. The settings form still presents them and
    # writes them only to audit_chain.settings.
    dlp_enabled:
      type: boolean
      label: 'DLP value-pattern scanning enabled'
    dlp_mask_mode:
      type: string
      label: 'DLP masking mode (redact or partial)'
    dlp_patterns:
      type: sequence
      label: 'DLP PII patterns'
      sequence:
        type: mapping
        label: 'DLP pattern'
        mapping:
          label:
            type: string
            label: 'Pattern label'
          regex:
            type: string
            label: 'PCRE regex body (no delimiters)'
          mask:
            type: string
            label: 'Mask character'
    anomaly_enabled:
      type: boolean
      label: 'Anomaly detection enabled'
    anomaly_alert_email:
      type: string
      label: 'Alert email address (empty = disabled)'
    anomaly_alert_webhook:
      type: boolean
      label: 'Send alerts via webhook queue'
    anomaly_alert_log:
      type: boolean
      label: 'Log alerts to mcp_sentinel channel'
    anomaly_hours_enabled:
      type: boolean
      label: 'Off-hours schedule enabled'
    anomaly_hours_timezone:
      type: string
      label: 'Operating-hours timezone'
    anomaly_hours_days:
      type: sequence
      label: 'Operating days (ISO 8601 weekday numbers, 1=Monday)'
      sequence:
        type: integer
        label: 'Weekday'
    anomaly_hours_start:
      type: string
      label: 'Operating-hours start (HH:MM)'
    anomaly_hours_end:
      type: string
      label: 'Operating-hours end (HH:MM)'
    anomaly_rules:
      type: sequence
      label: 'Anomaly detection rules'
      sequence:
        type: mapping
        label: 'Rule'
        mapping:
          id:
            type: string
            label: 'Rule ID'
          label:
            type: string
            label: 'Label'
          operation_pattern:
            type: string
            label: 'Operation prefix (e.g. entity_delete)'
          window_seconds:
            type: integer
            label: 'Lookback window (seconds)'
          threshold:
            type: integer
            label: 'Count threshold'
          debounce_seconds:
            type: integer
            label: 'Min seconds between alerts (default 3600)'
          enabled:
            type: boolean
            label: 'Rule enabled'
          signal:
            type: string
            label: 'Signal (count, off_hours, or bulk_read)'
          complete_ratio:
            type: float
            label: 'Bulk-read complete ratio (0-1)'
          entity_type:
            type: string
            label: 'Optional entity type for bulk-read'
    dashboard_broadcast:
      type: mapping
      label: 'Operator broadcast banner'
      mapping:
        message:
          type: label
          label: 'Broadcast message (empty = none)'
        severity:
          type: string
          label: 'Severity (info, warning, critical)'

mcp_sentinel.mcp_policy_profile.*:
  type: config_entity
  label: 'MCP policy profile'
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: required_label
      label: 'Label'
    weight:
      type: integer
      label: 'Weight'
    roles:
      type: sequence
      label: 'Roles'
      sequence:
        type: string
    allow_read:
      type: boolean
      label: 'Allow read'
    allow_write:
      type: boolean
      label: 'Allow write'
    allow_delete:
      type: boolean
      label: 'Allow delete'
    allow_graphql_mutations:
      type: boolean
      label: 'Allow GraphQL mutations'
    allowed_entity_types:
      type: sequence
      label: 'Allowed entity types'
      sequence:
        type: string
    denied_entity_types:
      type: sequence
      label: 'Denied entity types'
      sequence:
        type: string
    redacted_fields:
      type: sequence
      label: 'Redacted fields'
      sequence:
        type: string
    rate_limit_requests:
      type: integer
      label: 'Rate limit: max requests per window (0 = unlimited)'
    rate_limit_window:
      type: integer
      label: 'Rate limit: window in seconds'
    result_count_cap:
      type: integer
      label: 'Exfiltration guard: max result items (0 = unlimited)'
    response_size_cap:
      type: integer
      label: 'Exfiltration guard: max response bytes (0 = unlimited)'
    allowed_ips:
      type: sequence
      label: 'IP allowlist (empty = all IPs allowed)'
      sequence:
        type: string
        label: 'IP address or CIDR'
    allow_config_read:
      type: boolean
      label: 'Allow configuration read'
    allow_config_write:
      type: boolean
      label: 'Allow configuration write'
    denied_config_types:
      type: sequence
      label: 'Denied configuration name prefixes'
      sequence:
        type: string
        label: 'Config name or prefix'
    deny_publish:
      type: boolean
      label: 'Deny publishing (force draft / unpublished)'
    max_moderation_state:
      type: string
      label: 'Maximum moderation state an agent may set (empty = unrestricted)'
    deny_external_redirects:
      type: boolean
      label: 'Deny off-domain redirect targets (open-redirect guard)'
    allowed_redirect_hosts:
      type: sequence
      label: 'Allowed external redirect hosts (empty = the site''s own host(s))'
      sequence:
        type: string
        label: 'Hostname'
    entity_rules:
      type: sequence
      label: 'Per-entity-type destructive overrides'
      sequence:
        type: mapping
        label: 'Entity-type rule'
        mapping:
          allow_delete:
            type: boolean
            label: 'Allow delete for this entity type'
          allow_write:
            type: boolean
            label: 'Allow write for this entity type'
          allow_publish:
            type: boolean
            label: 'Allow publishing for this entity type (overrides deny_publish)'
    forbidden_role_permissions:
      type: sequence
      label: 'Permissions a governed role must not hold'
      sequence:
        type: string
        label: 'Permission machine name'
    acknowledged_role_permissions:
      type: sequence
      label: 'Acknowledged deliberate grants (role_id:permission or role_id:permission@environment)'
      sequence:
        type: string
        label: 'role_id:permission or role_id:permission@environment'
    allow_raw_sql:
      type: boolean
      label: 'Allow raw SQL through the governed Drush command (off by default)'
    evidence_required_actions:
      type: sequence
      label: 'Action classes requiring durable keyed evidence before execution'
      sequence:
        type: string
        label: 'Action class (entity_write, entity_delete)'
    egress_ceilings:
      type: mapping
      label: 'Highest classification label this profile may receive, per governed surface (absent = no ceiling)'
      mapping:
        tool:
          type: string
          label: 'Tool surface ceiling'
        context:
          type: string
          label: 'Context endpoint ceiling'
        jsonapi:
          type: string
          label: 'JSON:API ceiling'
        graphql:
          type: string
          label: 'GraphQL ceiling'
        drush:
          type: string
          label: 'Governed drush SQL ceiling'
