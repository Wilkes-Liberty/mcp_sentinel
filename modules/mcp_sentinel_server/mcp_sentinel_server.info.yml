name: 'MCP Sentinel Server'
type: module
description: 'Registers MCP Sentinel Tool plugins with mcp_server and wires OAuth scopes.'
package: 'AI / MCP'
core_version_requirement: ^10.6 || ^11.3

# Depends on the mcp_server Tool API bridge (which pulls in mcp_server itself).
dependencies:
  - mcp_sentinel:mcp_sentinel
  - mcp_server:mcp_server_tool_bridge

# mcp_server:mcp_server_oauth is installed independently, but production
# readiness and the default `drush mcp-sentinel:setup` path require it. The
# only exception is the explicit development-only command option, which can
# never report the connector-facing contract as ready.
