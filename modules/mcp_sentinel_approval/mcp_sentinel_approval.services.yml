services:
  mcp_sentinel_approval.gate:
    class: Drupal\mcp_sentinel_approval\Service\McpApprovalGate
    arguments:
      - '@config.factory'

  mcp_sentinel_approval.break_glass:
    class: Drupal\mcp_sentinel_approval\Service\McpBreakGlassManager
    arguments:
      - '@entity_type.manager'
      - '@datetime.time'
      - '@config.factory'
      - '@mcp_sentinel.audit_logger'

  mcp_sentinel_approval.manifest_binder:
    class: Drupal\mcp_sentinel_approval\Service\McpManifestBinder
    arguments:
      - '@mcp_sentinel.action_manifest_sealer'
      - '@database'
      - '@datetime.time'
      - '@current_user'
      - '@entity_type.manager'

  mcp_sentinel_approval.executor:
    class: Drupal\mcp_sentinel_approval\Service\McpApprovalExecutor
    arguments:
      - '@entity_type.manager'
      - '@mcp_sentinel.audit_logger'
      - '@current_user'
      - '@datetime.time'
      - '@config.factory'
      - '@module_installer'
      - '@mcp_sentinel_approval.break_glass'
      - '@module_handler'
      - '@mcp_sentinel_approval.manifest_binder'

  mcp_sentinel_approval.destructive_op_subscriber:
    class: Drupal\mcp_sentinel_approval\EventSubscriber\McpDestructiveOpSubscriber
    arguments:
      - '@mcp_sentinel_approval.gate'
      - '@entity_type.manager'
      - '@logger.channel.mcp_sentinel'
      - '@mcp_sentinel.action_manifest_sealer'
      - '@mcp_sentinel.policy_resolver'
    tags:
      - { name: event_subscriber }

  mcp_sentinel_approval.destructive_action_subscriber:
    class: Drupal\mcp_sentinel_approval\EventSubscriber\McpDestructiveActionSubscriber
    arguments:
      - '@mcp_sentinel_approval.gate'
      - '@entity_type.manager'
      - '@logger.channel.mcp_sentinel'
      - '@mcp_sentinel.action_manifest_sealer'
      - '@mcp_sentinel.policy_resolver'
    tags:
      - { name: event_subscriber }

  mcp_sentinel_approval.break_glass_conduct_subscriber:
    class: Drupal\mcp_sentinel_approval\EventSubscriber\McpBreakGlassConductSubscriber
    arguments:
      - '@mcp_sentinel.policy_resolver'
      - '@mcp_sentinel.audit_logger'
      - '@current_user'
      - '@config.factory'
      - '@config.storage'
      - '@service_container'
    tags:
      - { name: event_subscriber }
