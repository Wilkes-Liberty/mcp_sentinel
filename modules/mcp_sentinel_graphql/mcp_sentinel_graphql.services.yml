services:
  mcp_sentinel_graphql.governance_subscriber:
    class: Drupal\mcp_sentinel_graphql\EventSubscriber\GraphqlGovernanceSubscriber
    arguments:
      - '@mcp_sentinel.audit_logger'
      - '@config.factory'
      - '@mcp_sentinel.governance_readiness'
      - '@current_user'
      - '@?mcp_sentinel.access_checker'
      - '@?cache.graphql.results'
    tags:
      - { name: event_subscriber }
