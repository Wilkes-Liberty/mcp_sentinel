name: composer audit
on:
  pull_request: { branches: ['**'] }
  # The development branch is 1.x. This said '1.0.x' — a branch that does not
  # exist here (it survives on the drupalcode mirror, where it is still HEAD),
  # so the push trigger never fired and only the pull_request one ever ran.
  push: { branches: ['1.x'] }
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4' }
      - run: composer install --no-interaction --no-progress
        continue-on-error: true
      - run: composer audit
        continue-on-error: true
