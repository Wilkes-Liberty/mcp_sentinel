name: composer audit
on:
  pull_request: { branches: ['**'] }
  push: { branches: ['1.0.x'] }
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4' }
      - run: composer install --no-interaction --no-progress
        continue-on-error: true
      - run: composer audit
        continue-on-error: true
