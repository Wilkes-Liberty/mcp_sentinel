  # drupal.org gitlab_templates layout (DEV-1049). The matrix job above
  # installs this module through a composer path repo at
  # web/modules/contrib/mcp_sentinel. On d.o the checkout is the
  # project root: expand_composer_json.php merges this module's
  # composer.json with core-recommended (and strips
  # require.drupal/core when IGNORE_PROJECT_DRUPAL_CORE_VERSION=1),
  # composer install writes web/ and vendor/ here
  # (DRUPAL_ROOT=$CI_PROJECT_DIR/web), and symlink_project.php
  # mounts each project entry into web/modules/custom/mcp_sentinel.
  # The templates then move composer.json.backup onto that mount
  # and leave the expanded file at the project root. The old
  # GitHub layout job missed McpCoreCompatibilityTest because
  # it ran Kernel tests only. The module's real path sits
  # outside the docroot. GitHub missed Extension.php:75 because
  # setup-php leaves zend.assertions off. This job runs those
  # scripts in the checkout, keeps the expanded composer.json
  # where d.o leaves it, runs Unit as well as Kernel, and
  # enables assertions.
  #
  # phpunit on d.o is `sudo -u www-data -H -E` after
  # `chown -R www-data:www-data $CI_PROJECT_DIR` (gitlab_templates
  # .setup-webserver). The helper clone leaves .git; composer
  # artifacts exclude it. The php-8.3-ubuntu-apache image
  # installs git. After that chown the process user owns the
  # repo, so the phpunit job does not set safe.directory (the
  # Drupal CMS job does). This job repeats the chown and the
  # www-data user so McpCoreCompatibilityTest asks git the
  # same way d.o does.
  #
  # Do not copy `-E` onto GitHub. ubuntu-latest is 26.04;
  # that image's sudo ignores it and the www-data process
  # loses PHP_INI_SCAN_DIR, SIMPLETEST_DB, and
  # MCP_SENTINEL_REQUIRE_ZEND_ASSERTIONS (run 40077021782).
  # as-www-data.sh hands those through env(1) instead.
  phpunit-drupalorg-layout:
    name: PHPUnit — Drupal.org layout (Drupal 11, PHP 8.4)
    needs: changes
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout the module as the project root
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php8.4-composer
          restore-keys: |
            ${{ runner.os }}-php8.4-composer
            ${{ runner.os }}-composer-

      - name: Build Drupal the way gitlab_templates does
        env:
          # Pin to gitlab_templates 1.17.3
          # (3f225a00f6e6b68b10a5fa027e2637c4331a8db3), not default-ref.
          # To bump: set GITLAB_TEMPLATES_REF to the new tag's
          # commit SHA and replace both sha256 values below.
          # Dependabot will not do this. drupal.org tracks main
          # through .gitlab-ci.yml (_GITLAB_TEMPLATES_REF: main).
          GITLAB_TEMPLATES_REF: '3f225a00f6e6b68b10a5fa027e2637c4331a8db3'
          DRUPAL_CORE: '^11.3'
          _WEB_ROOT: web
          PROJECT_NAME: mcp_sentinel
          IGNORE_PROJECT_DRUPAL_CORE_VERSION: '1'
        run: |
          set -euo pipefail
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          # Capture the project's own top-level entries before
          # composer install writes web/ and vendor/.
          export PROJECT_FILES
          PROJECT_FILES="$(ls -A)"
          retry curl -fsSL -o expand_composer_json.php \
            "https://git.drupalcode.org/project/gitlab_templates/-/raw/${GITLAB_TEMPLATES_REF}/scripts/expand_composer_json.php"
          retry curl -fsSL -o symlink_project.php \
            "https://git.drupalcode.org/project/gitlab_templates/-/raw/${GITLAB_TEMPLATES_REF}/scripts/symlink_project.php"
          # sha256 of the 1.17.3 / 3f225a00 scripts.
          echo "9d799367345aee6a70f371f34490e0c8622d9e8e1c02d0a3726523c411b40866  expand_composer_json.php" | sha256sum -c -
          echo "596c389bee74250ab11718b81be5118e281e3c453a98b0f43e61e067f783cbd9  symlink_project.php" | sha256sum -c -
          cp -v composer.json composer.json.backup
          php expand_composer_json.php
          composer config --json policy.advisories.ignore-id "${COMPOSER_ADVISORY_IGNORE_IDS}"
          retry composer install --no-interaction --no-progress
          # twig/twig <3.30: 3.30.0 compiles Drupal's swapped escape
          # filter straight into EscaperRuntime::escape() and every
          # rendered page 500s (twigphp/Twig#4952).
          retry composer require -W --no-interaction --no-progress \
            "twig/twig:<3.30.0"
          # gitlab_templates require-drush: Kernel tests instantiate
          # Drush command classes.
          retry composer require --dev --update-with-all-dependencies \
            --no-interaction --no-progress "drush/drush:^13"
          rm -f expand_composer_json.php
          export DRUPAL_PROJECT_FOLDER="${GITHUB_WORKSPACE}/web/modules/custom/mcp_sentinel"
          php symlink_project.php
          rm -f symlink_project.php
          # Same restore as gitlab_templates: the expanded file
          # stays at the project root, and the module file moves
          # onto the custom mount. The old job missed the
          # compatibility break because it ran Kernel tests only.
          if [[ -f composer.json.backup ]]; then
            echo "Restoring composer.json from backup onto the custom mount"
            rm -v "${DRUPAL_PROJECT_FOLDER}/composer.json"
            mv -v composer.json.backup "${DRUPAL_PROJECT_FOLDER}/composer.json"
          fi
          # setup-php leaves assertions off; d.o phpunit has them on.
          scan="${PHP_INI_SCAN_DIR:-$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')}"
          mkdir -p "${RUNNER_TEMP}/php-scan"
          {
            printf 'zend.assertions=1\n'
            printf 'assert.exception=1\n'
          } > "${RUNNER_TEMP}/php-scan/zz-do-layout.ini"
          if [ -n "${scan}" ]; then
            echo "PHP_INI_SCAN_DIR=${scan}:${RUNNER_TEMP}/php-scan" >> "${GITHUB_ENV}"
          else
            echo "PHP_INI_SCAN_DIR=${RUNNER_TEMP}/php-scan" >> "${GITHUB_ENV}"
          fi

      - name: Confirm the drupal.org layout
        run: |
          set -euo pipefail
          mount="${GITHUB_WORKSPACE}/web/modules/custom/mcp_sentinel"
          test -f mcp_sentinel.info.yml \
            || { echo "::error::checkout is not the module project root"; exit 1; }
          test -d "${GITHUB_WORKSPACE}/web" && test -d "${GITHUB_WORKSPACE}/vendor" \
            || { echo "::error::web/ and vendor/ must live inside the checkout"; exit 1; }
          test -d "${mount}" && test ! -L "${mount}" \
            || { echo "::error::custom mount must be a real directory of per-entry symlinks, not a directory symlink or copy"; exit 1; }
          test -L "${mount}/tests" && test -L "${mount}/mcp_sentinel.info.yml" \
            || { echo "::error::tests/ and mcp_sentinel.info.yml must be symlinks back to the module files"; exit 1; }
          test "$(realpath "${mount}/tests")" = "$(realpath "${GITHUB_WORKSPACE}/tests")" \
            || { echo "::error::tests symlink does not resolve to the module tests/ directory"; exit 1; }
          case "$(realpath "${mount}/tests")" in
            "$(realpath "${GITHUB_WORKSPACE}/web")"*) echo "::error::module realpath is inside the docroot"; exit 1 ;;
          esac
          test ! -e "${GITHUB_WORKSPACE}/web/modules/contrib/mcp_sentinel" \
            || { echo "::error::contrib path-repo link is still present — the GitHub layout would mask the d.o failure"; exit 1; }
          # d.o leaves the expanded composer.json at the project
          # root (no require.drupal/core) and the module file on
          # the mount. The naive test walks the checkout, so this
          # is the failure McpCoreCompatibilityTest hit on
          # pipelines 1012720 and 1012776.
          test ! -L composer.json \
            || { echo "::error::project-root composer.json must be the expanded file, not a symlink"; exit 1; }
          php -r '
            $c = json_decode((string) file_get_contents("composer.json"), TRUE);
            if (!is_array($c) || isset($c["require"]["drupal/core"])) {
              fwrite(STDERR, "::error::project-root composer.json still has require[drupal/core]; d.o expand_composer_json strips it.\n");
              exit(1);
            }
          '
          test -f "${mount}/composer.json" && test ! -L "${mount}/composer.json" \
            || { echo "::error::mount composer.json must be the restored module file, not a symlink to the expanded project-root file"; exit 1; }
          php -r '
            $c = json_decode((string) file_get_contents($argv[1]), TRUE);
            if (!is_array($c) || !isset($c["require"]["drupal/core"])) {
              fwrite(STDERR, "::error::custom mount composer.json is not the module file.\n");
              exit(1);
            }
          ' "${mount}/composer.json"
          test -f web/core/modules/announcements_feed/announcements_feed.info.yml \
            || { echo "::error::d.o layout must build web/core inside the checkout so a naive scan would read core info.yml files"; exit 1; }
          echo "DRUPAL_ROOT: ${GITHUB_WORKSPACE}/web"
          echo "tests realpath: $(realpath "${mount}/tests")"
          echo "tests symlink: $(readlink "${mount}/tests")"
          echo "project-root composer.json: expanded (no require.drupal/core)"
          echo "mount composer.json: $(realpath "${mount}/composer.json")"

      - name: Match d.o phpunit ownership
        run: |
          set -euo pipefail
          as_www_data() {
            bash "${GITHUB_WORKSPACE}/.github/ci/as-www-data.sh" "$@"
          }
          # Evidence (gitlab_templates main + job 13051645 raw log):
          # image registry.gitlab.com/drupal-infrastructure/drupalci/drupalci-environments/php-8.3-ubuntu-apache:production
          # helper: "Initialized empty Git repository in /builds/project/mcp_sentinel/.git/"
          # script: chown -R www-data:www-data $CI_PROJECT_DIR
          # script: sudo -u www-data -H -E php web/core/scripts/run-tests.sh ...
          # Image runDeps include git and sudo. phpunit does not
          # run `git config safe.directory`. Before chown, www-data
          # vs the helper-clone owner is a dubious-ownership miss.
          # GitHub cannot use that -E: ubuntu-26.04 sudo ignores
          # it. as_www_data is the same user/home, with the job
          # env passed through env(1).
          workspace="${GITHUB_WORKSPACE}"
          echo "checkout owner before chown: $(stat -c '%U:%G' "${workspace}")"
          echo ".git owner before chown: $(stat -c '%U:%G' "${workspace}/.git")"
          echo "runner: $(id)"
          echo "www-data: $(id www-data)"
          command -v git
          git --version

          # GHA keeps /home/runner/work/<repo> at 0700. www-data
          # cannot even enter the workspace until those parents
          # are traversable. d.o's /builds/project is 0755.
          ancestor="$(dirname "${workspace}")"
          while [ "${ancestor}" != "/" ] && [ -n "${ancestor}" ]; do
            sudo chmod a+x "${ancestor}" || true
            ancestor="$(dirname "${ancestor}")"
          done

          before_err="$(mktemp)"
          if as_www_data git -C "${workspace}" ls-files -- web \
            > /tmp/git-ls-before.out 2>"${before_err}"; then
            echo "git as www-data before chown: succeeded"
            tr '\0' '\n' < /tmp/git-ls-before.out || true
          else
            echo "git as www-data before chown: failed (expected on a stock runner)"
            cat "${before_err}"
            if ! grep -qiE 'dubious ownership|safe\.directory' "${before_err}"; then
              echo "::warning::www-data git failed before chown, but not with dubious ownership"
            fi
          fi

          sudo mkdir -p /var/www
          sudo chown www-data:www-data /var/www
          sudo chown -R www-data:www-data "${workspace}"

          echo "checkout owner after chown: $(stat -c '%U:%G' "${workspace}")"
          echo ".git owner after chown: $(stat -c '%U:%G' "${workspace}/.git")"

          if ! as_www_data git -C "${workspace}" ls-files -z -- web \
            > /tmp/git-ls-after.out 2>/tmp/git-ls-after.err; then
            echo "::error::git as www-data after chown cannot answer; fail-closed would walk web/core again (pipelines 1012720/1012776/1012775)"
            cat /tmp/git-ls-after.err
            exit 1
          fi
          if [ -s /tmp/git-ls-after.out ]; then
            echo "::error::git tracks paths under web/; the d.o skip must not fire"
            tr '\0' '\n' < /tmp/git-ls-after.out
            exit 1
          fi
          echo "git as www-data after chown: empty ls-files for web/"
          mount_info="${workspace}/web/modules/custom/mcp_sentinel/mcp_sentinel.info.yml"
          test "$(as_www_data realpath "${mount_info}")" = "$(as_www_data realpath "${workspace}/mcp_sentinel.info.yml")" \
            || { echo "::error::mount info.yml does not resolve to this checkout as www-data"; exit 1; }
          # Same checks the Kernel bypass prepends. php -r
          # ignores auto_prepend_file, so run the file. Fail
          # here so a dropped scan dir does not wait for that
          # step — and so Unit cannot go green on the wrong
          # php.ini.
          test -f "${workspace}/.github/ci/do-layout-assert-ini.php" \
            || { echo "::error::do-layout-assert-ini.php is missing"; exit 1; }
          as_www_data php -f "${workspace}/.github/ci/do-layout-assert-ini.php"

      - name: PHPUnit — Unit (drupal.org layout)
        working-directory: ${{ github.workspace }}
        env:
          SYMFONY_DEPRECATIONS_HELPER: weak
          # 404 Unit tests (402 on 1.x tip cd68e06 / #360,
          # plus two git-guard self-tests). This layout job
          # used to run Kernel only, so
          # McpCoreCompatibilityTest never saw web/core
          # inside the checkout. Floor sits 9 under that
          # count so losing the 12-test approval Unit
          # suite trips it.
          MIN_TESTS: '395'
        run: |
          set -euo pipefail
          as_www_data() {
            bash "${GITHUB_WORKSPACE}/.github/ci/as-www-data.sh" "$@"
          }
          as_www_data rm -f junit-unit-do-*.xml
          config="${PWD}/web/core/phpunit.xml.dist"
          module="${PWD}/web/modules/custom/mcp_sentinel"
          suites=()
          for dir in "${module}"/tests/src/Unit \
                     "${module}"/modules/*/tests/src/Unit; do
            [ -d "${dir}" ] && suites+=("${dir}")
          done
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::error::No Unit test directories found under ${module}."
            exit 1
          fi
          i=0
          for dir in "${suites[@]}"; do
            i=$((i + 1))
            echo "--- ${dir#"${module}/"}"
            as_www_data vendor/bin/phpunit -c "${config}" \
              --log-junit "${PWD}/junit-unit-do-${i}.xml" \
              "${dir}"
          done
          total="$(sudo cat junit-unit-do-*.xml | grep -ho '<testcase ' | wc -l | tr -d ' ')"
          echo "Collected ${total} Unit tests across ${#suites[@]} directories (floor ${MIN_TESTS})."
          if [ "${total}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Collected only ${total} Unit tests, below the floor of ${MIN_TESTS}."
            exit 1
          fi
          compat_ran="$(sudo grep -ho 'classname="[^"]*McpCoreCompatibilityTest"' junit-unit-do-*.xml | wc -l | tr -d ' ')"
          echo "Collected ${compat_ran} McpCoreCompatibilityTest cases as www-data."
          if [ "${compat_ran}" -lt 1 ]; then
            echo "::error::McpCoreCompatibilityTest did not run under the www-data d.o-layout path."
            exit 1
          fi

      - name: PHPUnit — Kernel (drupal.org layout)
        timeout-minutes: 40
        working-directory: ${{ github.workspace }}
        env:
          SIMPLETEST_DB: 'sqlite://localhost/:memory:'
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp
          SYMFONY_DEPRECATIONS_HELPER: weak
          # 1206 Kernel tests, including the dedicated bypass
          # invocation. The old junit-do-*.xml glob also ate the
          # Unit logs (junit-do-unit-*.xml) and reported 1594.
          # Floor sits 9 under the true Kernel count so losing a
          # 10-test suite trips it.
          MIN_TESTS: '1197'
          MCP_SENTINEL_REQUIRE_ZEND_ASSERTIONS: '1'
        run: |
          set -euo pipefail
          as_www_data() {
            bash "${GITHUB_WORKSPACE}/.github/ci/as-www-data.sh" "$@"
          }
          as_www_data rm -f junit-do-*.xml
          config="${PWD}/web/core/phpunit.xml.dist"
          module="${PWD}/web/modules/custom/mcp_sentinel"

          echo "--- tests/src/Kernel/McpPrincipalAuthGuardBypassTest.php"
          test -f .github/ci/do-layout-assert-ini.php \
            || { echo "::error::do-layout-assert-ini.php is missing"; exit 1; }
          as_www_data php -d auto_prepend_file="${PWD}/.github/ci/do-layout-assert-ini.php" \
            vendor/bin/phpunit -c "${config}" \
            --log-junit "${PWD}/junit-do-bypass.xml" \
            "${module}/tests/src/Kernel/McpPrincipalAuthGuardBypassTest.php"

          suites=()
          for dir in "${module}"/tests/src/Kernel \
                     "${module}"/modules/*/tests/src/Kernel; do
            [ -d "${dir}" ] && suites+=("${dir}")
          done
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::error::No Kernel test directories found under ${module}."
            exit 1
          fi
          i=0
          for dir in "${suites[@]}"; do
            i=$((i + 1))
            echo "--- ${dir#"${module}/"}"
            extra=()
            # The dedicated bypass run is counted once. Do not
            # collect the same file again from tests/src/Kernel.
            if [ "${dir}" = "${module}/tests/src/Kernel" ]; then
              extra=(--exclude-filter '/\\McpPrincipalAuthGuardBypassTest::/')
            fi
            as_www_data vendor/bin/phpunit -c "${config}" \
              --log-junit "${PWD}/junit-do-${i}.xml" \
              "${extra[@]}" \
              "${dir}"
          done
          total="$(sudo cat junit-do-*.xml | grep -ho '<testcase ' | wc -l | tr -d ' ')"
          echo "Collected ${total} Kernel tests across $((${#suites[@]} + 1)) invocations (floor ${MIN_TESTS})."
          if [ "${total}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Collected only ${total} Kernel tests, below the floor of ${MIN_TESTS}."
            exit 1
          fi
          # Losing the 8-test dedupe class would not trip the floor
          # (1206-8=1198). Require those cases in the JUnit output.
          dedupe_ran="$(sudo grep -ho 'classname="[^"]*McpSealedTokenDenialAuditorDedupeTest"' junit-do-*.xml | wc -l | tr -d ' ')"
          echo "Collected ${dedupe_ran} McpSealedTokenDenialAuditorDedupeTest cases."
          if [ "${dedupe_ran}" -lt 8 ]; then
            echo "::error::McpSealedTokenDenialAuditorDedupeTest collected ${dedupe_ran} cases, expected at least 8."
            exit 1
          fi

      - name: Restore runner ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"

  # The single required check for the suite (#255). A matrix job skipped by a
  # job-level `if:` reports under its unexpanded name, so the per-leg PHPUnit
  # names cannot be required without blocking every docs-only pull request.
  # This job always runs and passes only when each test job passed or was
  # skipped by the docs-only filter. Add new test jobs to `needs`.
  tests-gate:
    name: Tests gate
    if: always()
    needs:
      - changes
      - refresh-latest-contrib-fail-closed
      - phpunit
      - phpunit-functional
      - phpunit-functional-pgsql-draft
      - phpunit-functional-d10
      - phpunit-drupalorg-layout
      - phpcs
      - phpstan
      - phpunit-mysql-operator-binding
      - phpunit-pgsql-operator-binding
      - cspell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: always()

      - name: Forbid hardcoded installer paths in tests
        if: always()
        run: |
          set -euo pipefail
          # A fixture that spells either installer path cannot see the
          # other venue. Derive the path from the registered module.
          # Runs even when a PHPUnit job already failed so the literal
          # is visible on the same red run as the layout assertion.
          # Only tests/src/Unit/McpCoreCompatibilityTest.php may
          # name the gitlab_templates custom mount (and the contrib
          # twin); that layout is what it is testing. Basename
          # excludes would also spare a copy under modules/*/tests.
          paths=(tests)
          for dir in modules/*/tests; do
            [ -d "${dir}" ] && paths+=("${dir}")
          done
          hits="$(grep -R -n -E --binary-files=without-match \
            'modules/(contrib|custom)/mcp_sentinel' "${paths[@]}" || true)"
          hits="$(printf '%s\n' "${hits}" | grep -v \
            '^tests/src/Unit/McpCoreCompatibilityTest.php:' || true)"
          hits="$(printf '%s\n' "${hits}" | sed '/^$/d')"
          if [ -n "${hits}" ]; then
            printf '%s\n' "${hits}"
            echo "::error::tests/ hardcodes a modules/contrib or modules/custom mcp_sentinel path."
            exit 1
          fi

      - name: Require every test job to pass or be skipped
        if: always()
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) echo "::error::A test job ended with '${result}'."; exit 1 ;;
            esac
          done
