name: Tests

# Runs the PHPUnit suite on pull requests and on push to 1.x. A docs-only
# pull request skips the heavy jobs below (DEV-735); see the `changes` job.
# A push to 1.x always runs them: that commit is what ships, and a release
# commit usually touches only CHANGELOG.md, so skipping it reported a green
# run that tested nothing while 1.x was red (#255).
#
# Until this existed, nothing ran the tests: a PR could go green, merge, and
# ship while the suite was broken, and the only thing between a regression and a
# release was whoever remembered to run PHPUnit by hand. For a module whose job
# is enforcing a security boundary, that is the wrong guarantee — see issue #32.
#
# Unit + Kernel run across the support matrix; Functional runs as its own
# blocking job on the ceiling leg (#58, restored in #169). One functional
# leg is a deliberate cost/coverage trade: the drupalcode GitLab pipeline
# still runs the full suite per push to 1.x and per release commit, and
# 1.12.0 proved a GitHub-only green is not a release gate — the JSON:API
# publish-gate fix shipped inert because only the functional suite could
# see it. Expanding GitHub Functional to the 10.6/11.3/11 matrix made
# PRs wait ~32 minutes on Drupal 10.6 BrowserTestBase.
on:
  pull_request: { branches: ['**'] }
  push: { branches: ['1.x'] }

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-only Packagist advisory ignores. Applied at every composer config
# site below. Do not copy this list into composer.json — site installs
# must still see these advisories.
#
# PKSA-p9gd-j6gr-6f9t: CVE-2026-53965 in mcp/sdk CLIENT HttpTransport
# SSE buffering. This scaffold uses the SDK only as the server side of
# drupal/mcp_server, so the vulnerable class is never instantiated.
# mcp_server pins ^0.6, which cannot reach the 0.7.1 fix — drop this
# ignore once upstream allows ^0.7.
#
# PKSA-xwpn-zs9j-6wy5: GHSA-r7cg-qjjm-xhqq, high. Unbounded parser
# recursion stack overflow in webonyx/graphql-php. Fixed in 15.32.3.
# CI cannot upgrade: drupal/graphql 4.x (via graphql_compose) pins
# graphql-php 14.x; there is no 14.x fix.
#
# PKSA-sf9j-1gs7-xzvx: GHSA-fc86-6rv6-2jpm, high. Quadratic validation
# via inline fragments in OverlappingFieldsCanBeMerged. Fixed in
# 15.32.2. Same 14.x pin as above.
#
# PKSA-7h5p-prw9-w5nr: GHSA-68jq-c3rv-pcrr / CVE-2026-40476, medium.
# Quadratic-complexity DoS in OverlappingFieldsCanBeMerged. Fixed in
# 15.31.5. Same 14.x pin as above.
env:
  COMPOSER_ADVISORY_IGNORE_IDS: '["PKSA-p9gd-j6gr-6f9t","PKSA-xwpn-zs9j-6wy5","PKSA-sf9j-1gs7-xzvx","PKSA-7h5p-prw9-w5nr"]'

jobs:
  # Detect whether this PR/push touches anything other than documentation. The
  # heavy jobs below are gated on this so a docs-only change doesn't burn CI
  # minutes (DEV-735). Gating is job-level `if:` — a skipped required job is
  # treated as a passing status check — not workflow-level `paths-ignore`,
  # which would leave a required check pending and block merges.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Pushes to 1.x always count as code changes (#255); only pull requests
      # may skip on docs-only changes.
      code: ${{ github.event_name == 'push' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # `predicate-quantifier: every` is required. The action defaults to
          # `some`, so a file matches if it matches any pattern. With `- '**'`
          # first, every file matches that one pattern, the `!` exclusions are
          # dead, and `code` is always true. `every` requires a file to match
          # all patterns, which is what "everything except docs" means.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  # Cheap, always-on: a swallowed `composer show` must fail this job,
  # not the later scaffold. Docs-only PRs still run it (DEV-1022).
  refresh-latest-contrib-fail-closed:
    name: Latest-stable refresh fails closed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: composer show failure and empty list must fail the refresh
        run: bash .github/ci/test-refresh-latest-contrib-fail-closed.sh

  phpunit:
    name: PHPUnit (Drupal ${{ matrix.drupal }}, PHP ${{ matrix.php }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Report every combination: a failure on one core version is a real
      # result, not a reason to hide the other.
      fail-fast: false
      matrix:
        include:
          # The floor of each declared range, plus the D11 ceiling
          # (^10.6 || ^11.3 || ^12). Drupal 12 is declared but is not a
          # required matrix leg yet: several hard dependencies still omit
          # ^12, so a D12 scaffold cannot resolve. The drupal.org
          # OPT_IN_TEST_NEXT_MAJOR job is the next-major signal (manual).
          #
          # Support the oldest branch upstream still supports, not the one we
          # happen to run: orgs upgrade slowly and a narrow floor discourages
          # adoption. But "supported upstream" is the test — an EOL branch is
          # not a kindness to claim, it is a lie. Per endoflife.date on
          # 2026-07-16 the only live branches are 10.6 and 11.3 (both EOL
          # 2026-12-16) and 11.4 (EOL 2027-07-07). 11.0/11.1/11.2 are dead,
          # which is why the 11 floor is 11.3 and not ^11.
          #
          # Every floor gets a leg, because a claim CI does not exercise is not
          # a claim. That is not theoretical: 11.0 and 11.1 sat inside a
          # released ^11 for versions, and the module fataled on both — nobody
          # noticed, because the only leg ran 11.4.
          #
          # Recheck when 10.6/11.3 go EOL on 2026-12-16.
          #
          # `constraint` is spelled out per leg rather than derived from
          # `drupal`, because the obvious derivation is wrong: ^11.3 means
          # ">=11.3 <12" and resolves to 11.4, so an "11.3" leg built that way
          # silently retests the ceiling. It went green doing exactly that
          # before the version probe printed "Drupal core: 11.4.4" underneath
          # the words "Drupal 11.3". A floor leg pins its minor (~11.3.0); the
          # ceiling leg deliberately floats (^11).
          #
          # phpunit is pinned per leg. Drupal 10's core-dev hard-requires ^9.6,
          # and 9.6 predates PHP 8 attributes: it does not error on one it
          # cannot read, it ignores it. That is why the suite also carries
          # annotations (@group, @dataProvider, @runTestsInSeparateProcesses)
          # alongside its attributes — 9.6 reads the annotations, 10/11 read the
          # attributes, and this leg is what keeps the pair honest. Drop the
          # annotations and 9.6 stops expanding the data providers: the Unit
          # directory alone falls from 62 tests to 53, without erroring.
          #
          # Both PHPUnit versions must therefore report the *same* test count.
          # That equality is the whole point of this leg, and it is asserted by
          # the count floor in the PHPUnit step rather than trusted — a green
          # check has already twice meant "ran almost nothing" here.
          # Drupal 10.6 / PHP 8.3 pins audit_chain 1.12.x so
          # McpSiemStreamingTest's logger.channel.audit_chain
          # fallback runs. Other legs refresh to latest-stable
          # (1.13.0+). The module constraint stays ^1.0.1.
          - drupal: '11'
            constraint: '^11'
            php: '8.4'
            phpunit: '^11.5'

    steps:
      - name: Checkout the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gd: image module. pdo_sqlite/sqlite3: the kernel-test database.
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php${{ matrix.php }}-composer
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer
            ${{ runner.os }}-composer-

      - name: Scaffold a Drupal site
        env:
          DRUPAL_CONSTRAINT: ${{ matrix.constraint }}
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project "drupal/recommended-project:${DRUPAL_CONSTRAINT}" drupal \
              --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          # Some deps are dev-stability (mcp_server is ^2.0@dev).
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          # Install the working copy, not the released package.
          composer config repositories.mcp_sentinel path ../module
          composer config --json policy.advisories.ignore-id "${COMPOSER_ADVISORY_IGNORE_IDS}"

      - name: Install dependencies
        working-directory: drupal
        env:
          DRUPAL_CONSTRAINT: ${{ matrix.constraint }}
          PHPUNIT_VERSION: ${{ matrix.phpunit }}
          AUDIT_CHAIN_CONSTRAINT: ${{ matrix.audit_chain }}
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          # -W (--with-all-dependencies) on both: recommended-project ships a
          # composer.lock, so each require is a *partial* update and composer
          # refuses to move transitive packages the lock pins — core-dev wants
          # phpunit, phpunit wants sebastian/diff ^6, the lock says 7.0.0, and
          # resolution fails. -W lets it move them.
          #
          # That is still not latest-stable contrib. d.o expand_composer_json
          # + composer install has no recommended-project lock, so it resolved
          # audit_chain 1.12.2 while this job stayed on 1.12.1 (DEV-1022).
          # refresh-latest-contrib.sh updates locked drupal/* except core*.
          #
          # twig/twig <3.30: 3.30.0 compiles Drupal's swapped escape filter
          # straight into EscaperRuntime::escape() and every rendered page
          # 500s (twigphp/Twig#4952). -W otherwise floats to 3.30. Drop the
          # pin when that issue ships a fixed release.
          retry composer require -W --no-interaction --no-progress \
            "drupal/mcp_sentinel:*@dev" \
            "twig/twig:<3.30.0"
          # core-dev brings PHPUnit; drush because the module ships Drush
          # commands whose tests instantiate them (they extend
          # Drush\Commands\DrushCommands); the rest are the contrib modules the
          # tests enable, mirroring the module's own require-dev.
          retry composer require -W --dev --no-interaction --no-progress \
            "drupal/core-dev:${DRUPAL_CONSTRAINT}" \
            "phpunit/phpunit:${PHPUNIT_VERSION}" \
            "drush/drush:^13" \
            "drupal/redirect:^1.10" "drupal/graphql_compose:^2.4" "drupal/mcp_server:^2.0@dev" \
            "drupal/paragraphs:^1.18" "drupal/entity_reference_revisions:^1.11" \
            "drupal/entity_usage:^2 || ^5" \
            "drupal/content_lock:^3.0" \
            "drupal/scheduler:^2.1" "drupal/scheduler_content_moderation_integration:^3.0"
          bash ../module/.github/ci/refresh-latest-contrib.sh
          # Pin after refresh. Latest-stable would pull 1.13 and
          # the 1.12.x SIEM fallback would never run on GitHub.
          if [ -n "${AUDIT_CHAIN_CONSTRAINT:-}" ]; then
            retry composer require -W --no-interaction --no-progress \
              "drupal/audit_chain:${AUDIT_CHAIN_CONSTRAINT}"
          fi

      - name: Assert the versions actually under test
        working-directory: drupal
        env:
          EXPECTED_DRUPAL: ${{ matrix.drupal }}
          EXPECTED_AUDIT_CHAIN: ${{ matrix.audit_chain }}
        run: |
          set -euo pipefail
          # require the autoloader inline: php ignores auto_prepend_file for -r
          # code, so loading it that way leaves Composer\InstalledVersions
          # undefined and the line fatals after echoing its label. With the
          # `|| true` this step used to carry, that fatal was invisible and the
          # next command's output landed on the "Drupal core:" line — so the
          # step confidently reported PHPUnit's version as Drupal's. No `|| true`
          # here: a probe that cannot answer must fail, not improvise.
          core="$(php -r 'require "vendor/autoload.php"; echo \Composer\InstalledVersions::getPrettyVersion("drupal/core");')"
          echo "Drupal core: ${core}"
          chain="$(php -r 'require "vendor/autoload.php"; echo \Composer\InstalledVersions::getPrettyVersion("drupal/audit_chain");')"
          echo "drupal/audit_chain: ${chain}"
          if [ -n "${EXPECTED_AUDIT_CHAIN:-}" ]; then
            case "${chain}" in
              1.12.*) ;;
              *) echo "::error::This leg pins audit_chain ${EXPECTED_AUDIT_CHAIN} so the SIEM 1.12.x fallback runs; resolved ${chain}."; exit 1 ;;
            esac
          fi
          vendor/bin/phpunit --version
          vendor/bin/drush --version || true

          # Assert, do not merely print. A leg named "11.3" resolved and tested
          # 11.4.4 and went green: ^11.3 means ">=11.3 <12", so the floor leg
          # quietly retested the ceiling and the range it existed to protect was
          # covered by nothing. Printing the resolved version had already caught
          # it — but only because a human happened to read the line. Checking it
          # is what makes the leg mean what its name says.
          case "${core}" in
            "${EXPECTED_DRUPAL}".*) ;;
            *) echo "::error::Leg claims Drupal ${EXPECTED_DRUPAL} but resolved ${core}. The leg is testing a version it does not name — fix matrix.constraint rather than this check."; exit 1 ;;
          esac

      - name: Confirm the working copy is what is under test
        working-directory: drupal
        run: |
          # A path repo can silently fall back to the registry package; if that
          # happened the suite would pass against code nobody changed.
          test -L web/modules/contrib/mcp_sentinel \
            || { echo "::error::mcp_sentinel is not symlinked to the working copy — the path repo did not apply"; exit 1; }
          readlink web/modules/contrib/mcp_sentinel

      - name: PHPUnit — red-proof identity, policy, and verify
        working-directory: drupal
        env:
          SIMPLETEST_DB: 'sqlite://localhost/:memory:'
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp
          SYMFONY_DEPRECATIONS_HELPER: weak
        run: |
          set -uo pipefail
          # THROW AWAY: phpunit <ini memory_limit> plus a bootstrap
          # that re-applies 256M after Drupal's bootstrap. php -d
          # did not hold (run 41081081921, Memory: 1.97 GB).
          python3 - <<'PY'
          from pathlib import Path
          import re
          Path("force-memory-bootstrap.php").write_text(
              "<?php\n"
              "require __DIR__ . '/web/core/tests/bootstrap.php';\n"
              "ini_set('memory_limit', '256M');\n"
          )
          src = Path("web/core/phpunit.xml.dist").read_text()
          src = re.sub(
              r'bootstrap="[^"]*"',
              'bootstrap="' + str(Path("force-memory-bootstrap.php").resolve()) + '"',
              src,
              count=1,
          )
          if re.search(r'<ini name="memory_limit"', src):
              src = re.sub(
                  r'<ini name="memory_limit" value="[^"]*"',
                  '<ini name="memory_limit" value="256M"',
                  src,
              )
          else:
              src = src.replace(
                  "<php>",
                  '<php>\n    <ini name="memory_limit" value="256M"/>',
                  1,
              )
          Path("phpunit.red-proof.xml").write_text(src)
          PY
          config="${PWD}/phpunit.red-proof.xml"
          identity="${PWD}/web/modules/contrib/mcp_sentinel/tests/src/Unit/McpAuditLoggerBoundIdentityTest.php"
          policy="${PWD}/web/modules/contrib/mcp_sentinel/tests/src/Unit/McpPolicyBundleTest.php"
          echo "memory_limit in red-proof xml:"
          grep memory_limit phpunit.red-proof.xml || true
          echo "bootstrap in red-proof xml:"
          grep bootstrap phpunit.red-proof.xml || true

          run_one() {
            local file="$1"
            local filter="$2"
            local out="/tmp/${filter}.out"
            echo "========== ${filter} =========="
            # Capture the full PHPUnit dump (wide-list actual JSON
            # drowned run 41093533665). Print only a short head/tail
            # so later cases still run and record.
            vendor/bin/phpunit -c "${config}" \
              --log-junit "/tmp/${filter}.xml" \
              "${file}" \
              --filter "${filter}" \
              > "${out}" 2>&1
            local rc=$?
            python3 - "${out}" <<'PY'
          import sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          head = data[:1500].decode("utf-8", "replace")
          tail = data[-1500:].decode("utf-8", "replace") if len(data) > 1500 else ""
          print(head)
          if tail:
              print("...[truncated %d bytes]..." % len(data))
              print(tail)
          PY
            if [ -f "/tmp/${filter}.xml" ]; then
              python3 - "${filter}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          name = sys.argv[1]
          try:
              tree = ET.parse("/tmp/%s.xml" % name)
          except Exception as exc:
              print("junit: unreadable (%s)" % exc)
              raise SystemExit(0)
          for case in tree.iter("testcase"):
              fails = list(case.findall("failure")) + list(case.findall("error"))
              print("junit %s failures=%d" % (case.get("name"), len(fails)))
              for item in fails:
                  msg = (item.get("message") or item.text or "")[:180]
                  print("  %s: %s" % (item.tag, msg.replace("\n", " ")))
          PY
            fi
            return "${rc}"
          }

          failed=0
          passed=0
          record() {
            local name="$1"
            local rc="$2"
            if [ "${rc}" -eq 0 ]; then
              echo "UNEXPECTED PASS: ${name}"
              passed=$((passed + 1))
            else
              echo "RECORDED FAIL/FATAL: ${name} exit=${rc}"
              failed=$((failed + 1))
            fi
          }

          cases=(
            "${policy}|testNormalizeRejectsGraphDeeperThanMaxDepth"
            "${policy}|testNormalizeAcceptsPolicyBundleWiderThanNodeBudget"
            "${policy}|testNormalizeAcceptsPolicyStringOverByteBudget"
            "${policy}|testVerifyReturnsNullForOverDepthDocument"
            "${identity}|testRepeatedLargeStringsFallBackToTypeMarker"
            "${identity}|testSelfReferencingObjectFallsBackToTypeMarker"
            "${identity}|testSharedReferenceFanOutFallsBackToTypeMarker"
            "${identity}|testWideScalarListFallsBackToTypeMarker"
          )
          for spec in "${cases[@]}"; do
            file="${spec%%|*}"
            filter="${spec##*|}"
            status=0
            run_one "${file}" "${filter}" || status=$?
            record "${filter}" "${status}"
          done

          echo "Red-proof summary: failed=${failed} passed=${passed}"
          echo "Red-proof must be all-red and nonzero."
          exit 1

  # Functional (BrowserTestBase) suite on the ceiling leg only. The setup
  # steps deliberately mirror the matrix job above rather than sharing a
  # composite action: the two jobs pin different things (the matrix pins
  # floors and PHPUnit 9.6 quirks; this job pins the webserver contract) and
  # coupling their evolution has already cost more than the duplication.
  # BrowserTestBase needs a real webserver serving the docroot and a real
  # SQLite file (the tested site runs in the server process, so :memory: is
  # not shared); PHP's built-in server with core's .ht.router.php is the
  # documented minimal setup. Added by #58 after 1.12.0 shipped a fix the
  # kernel suite could not see fail.
  #
  # Do not re-expand this to the Unit+Kernel Drupal matrix. d.o GitLab still
  # runs Functional on every floor; GitHub 10.6 BrowserTestBase was 31 minutes
  # on the 2.15.1 PR (#169).
  phpunit-functional:
    name: PHPUnit — Functional (Drupal 11, PHP 8.4)
    needs: changes
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # gd: image module. pdo_sqlite/sqlite3: the test database. curl/dom:
          # BrowserTestBase's Mink driver and response parsing.
          extensions: gd, pdo_sqlite, sqlite3, curl, dom
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php8.4-composer
          restore-keys: |
            ${{ runner.os }}-php8.4-composer
            ${{ runner.os }}-composer-

      - name: Scaffold a Drupal site
        env:
          DRUPAL_CONSTRAINT: '^11'
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project "drupal/recommended-project:${DRUPAL_CONSTRAINT}" drupal \
              --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config repositories.mcp_sentinel path ../module
          composer config --json policy.advisories.ignore-id "${COMPOSER_ADVISORY_IGNORE_IDS}"

      - name: Install dependencies
        working-directory: drupal
        env:
          DRUPAL_CONSTRAINT: '^11'
          PHPUNIT_CONSTRAINT: '^11.5'
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          # twig/twig <3.30: see the matrix job. Twig 3.30.0 500s every page.
          retry composer require -W --no-interaction --no-progress \
            "drupal/mcp_sentinel:*@dev" \
            "twig/twig:<3.30.0"
          retry composer require -W --dev --no-interaction --no-progress \
            "drupal/core-dev:${DRUPAL_CONSTRAINT}" \
            "phpunit/phpunit:${PHPUNIT_CONSTRAINT}" \
            "drush/drush:^13" \
            "drupal/redirect:^1.10" "drupal/graphql_compose:^2.4" "drupal/mcp_server:^2.0@dev" \
            "drupal/paragraphs:^1.18" "drupal/entity_reference_revisions:^1.11" \
            "drupal/entity_usage:^2 || ^5" \
            "drupal/content_lock:^3.0" \
            "drupal/scheduler:^2.1" "drupal/scheduler_content_moderation_integration:^3.0"
          bash ../module/.github/ci/refresh-latest-contrib.sh

      - name: Confirm the working copy is what is under test
        working-directory: drupal
        run: |
          test -L web/modules/contrib/mcp_sentinel \
            || { echo "::error::mcp_sentinel is not symlinked to the working copy — the path repo did not apply"; exit 1; }
          readlink web/modules/contrib/mcp_sentinel

      - name: Start the test webserver
        working-directory: drupal
        run: |
          mkdir -p web/sites/simpletest/browser_output web/sites/default/files
          chmod -R 777 web/sites
          # ABSOLUTE paths for docroot and router: the built-in server
          # resolves the router path per-request against its runtime working
          # directory, which is not the launch directory — a relative path
          # fatals on 'Failed opening required web/.ht.router.php' at request
          # time, every child-site page dies, and the suite fails 96 tests
          # with misleading login/status errors while the startup probe
          # (served before the fatal) still passes.
          nohup php -S 127.0.0.1:8888 -t "${PWD}/web" "${PWD}/web/.ht.router.php" > /tmp/php-server.log 2>&1 &
          # The probe must prove the server answers before tests assume it; a
          # dead server fails every test with a curl error that reads like a
          # product bug.
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8888/core/misc/drupal.js > /dev/null && exit 0
            sleep 0.5
          done
          echo "::error::test webserver never answered"; cat /tmp/php-server.log; exit 1

      - name: PHPUnit — Functional (blocking)
        working-directory: drupal
        env:
          # A real file, not :memory: — the tested site runs inside the
          # webserver process and must see the same database.
          SIMPLETEST_DB: 'sqlite://localhost/sites/default/files/test.sqlite'
          SIMPLETEST_BASE_URL: 'http://127.0.0.1:8888'
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp
          SYMFONY_DEPRECATIONS_HELPER: weak
          # Same doctrine as the matrix job: assert the count, not the exit
          # status. Includes mcp_sentinel_graphql functional so the
          # batch / persisted queryId cases cannot silently skip. The
          # floor catches a dropped directory, not normal drift.
          MIN_TESTS: '66'
        run: |
          set -euo pipefail
          rm -f junit-Functional.xml
          config="${PWD}/web/core/phpunit.xml.dist"
          vendor/bin/phpunit -c "${config}" \
            --log-junit "${PWD}/junit-Functional.xml" \
            "${PWD}/web/modules/contrib/mcp_sentinel/tests/src/Functional" \
            "${PWD}/web/modules/contrib/mcp_sentinel/modules/mcp_sentinel_approval/tests/src/Functional" \
            "${PWD}/web/modules/contrib/mcp_sentinel/modules/mcp_sentinel_graphql/tests/src/Functional"
          total="$( (grep -ho '<testcase ' junit-Functional.xml || true) | wc -l | tr -d ' ')"
          echo "Collected ${total} functional tests (floor ${MIN_TESTS})."
          if [ "${total}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Collected only ${total} functional tests, below the floor of ${MIN_TESTS}. The suite was dropped, not fixed."
            exit 1
          fi

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: functional-failure-evidence
          path: |
            /tmp/php-server.log
            /tmp/*.html
          if-no-files-found: ignore

  # PostgreSQL acceptance for governed draft continuation (d.o #3621022).
  # The sqlite functional matrix never saw core #2920527: a no-save PATCH
  # 500ed on Postgres when node grants plus a node-reference field nested a
  # SELECT inside the endpoint transaction. This job is that reproduction,
  # not a second copy of the whole functional suite.
  phpunit-functional-pgsql-draft:
    name: PHPUnit — Functional PostgreSQL draft (Drupal 11, PHP 8.4)
    needs: changes
    if: false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: drupal
          POSTGRES_USER: drupal
          POSTGRES_PASSWORD: drupal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drupal -d drupal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, pdo_pgsql, pgsql, curl, dom
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php8.4-composer
          restore-keys: |
            ${{ runner.os }}-php8.4-composer
            ${{ runner.os }}-composer-

      - name: Scaffold a Drupal site
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project "drupal/recommended-project:^11" drupal \
              --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config repositories.mcp_sentinel path ../module
          composer config --json policy.advisories.ignore-id "${COMPOSER_ADVISORY_IGNORE_IDS}"

      - name: Install dependencies
        working-directory: drupal
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          # twig/twig <3.30: see the matrix job. Twig 3.30.0 500s every page.
          retry composer require -W --no-interaction --no-progress \
            "drupal/mcp_sentinel:*@dev" \
            "twig/twig:<3.30.0"
          retry composer require -W --dev --no-interaction --no-progress \
            "drupal/core-dev:^11" \
            "phpunit/phpunit:^11.5" \
            "drush/drush:^13" \
            "drupal/redirect:^1.10" "drupal/graphql_compose:^2.4" "drupal/mcp_server:^2.0@dev" \
            "drupal/paragraphs:^1.18" "drupal/entity_reference_revisions:^1.11" \
            "drupal/entity_usage:^2 || ^5" \
            "drupal/content_lock:^3.0" \
            "drupal/scheduler:^2.1" "drupal/scheduler_content_moderation_integration:^3.0"
          bash ../module/.github/ci/refresh-latest-contrib.sh

      - name: Confirm the working copy is what is under test
        working-directory: drupal
        run: |
          test -L web/modules/contrib/mcp_sentinel \
            || { echo "::error::mcp_sentinel is not symlinked to the working copy — the path repo did not apply"; exit 1; }
          readlink web/modules/contrib/mcp_sentinel

      - name: Start the test webserver
        working-directory: drupal
        run: |
          mkdir -p web/sites/simpletest/browser_output web/sites/default/files
          chmod -R 777 web/sites
          nohup php -S 127.0.0.1:8888 -t "${PWD}/web" "${PWD}/web/.ht.router.php" > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8888/core/misc/drupal.js > /dev/null && exit 0
            sleep 0.5
          done
          echo "::error::test webserver never answered"; cat /tmp/php-server.log; exit 1

      - name: PHPUnit — PostgreSQL flood keys (blocking)
        working-directory: drupal
        env:
          SIMPLETEST_DB: 'pgsql://drupal:drupal@127.0.0.1:5432/drupal'
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp
          SYMFONY_DEPRECATIONS_HELPER: weak
        run: |
          vendor/bin/phpunit -c "${PWD}/web/core/phpunit.xml.dist" \
            "${PWD}/web/modules/contrib/mcp_sentinel/tests/src/Kernel/McpRateLimiterTest.php"

      - name: PHPUnit — Functional PostgreSQL draft (blocking)
        working-directory: drupal
        env:
          SIMPLETEST_DB: 'pgsql://drupal:drupal@127.0.0.1:5432/drupal'
          SIMPLETEST_BASE_URL: 'http://127.0.0.1:8888'
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp
          SYMFONY_DEPRECATIONS_HELPER: weak
          MIN_TESTS: '11'
        run: |
          set -euo pipefail
          rm -f junit-Functional-pgsql-draft.xml
          config="${PWD}/web/core/phpunit.xml.dist"
          vendor/bin/phpunit -c "${config}" \
            --log-junit "${PWD}/junit-Functional-pgsql-draft.xml" \
            "${PWD}/web/modules/contrib/mcp_sentinel/tests/src/Functional/McpDraftResourceTest.php" \
            "${PWD}/web/modules/contrib/mcp_sentinel/tests/src/Functional/McpDraftTranslationTest.php" \
            "${PWD}/web/modules/contrib/mcp_sentinel/tests/src/Functional/McpDraftParagraphTranslationTest.php"
          total="$( (grep -ho '<testcase ' junit-Functional-pgsql-draft.xml || true) | wc -l | tr -d ' ')"
          echo "Collected ${total} PostgreSQL draft tests (floor ${MIN_TESTS})."
          if [ "${total}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Collected only ${total} PostgreSQL draft tests, below the floor of ${MIN_TESTS}."
            exit 1
          fi

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: functional-pgsql-draft-failure-evidence
          path: |
            /tmp/php-server.log
            /tmp/*.html
          if-no-files-found: ignore

  # Drupal 10.6 functional floor for published-translation revise (#3625483).
  # The unit/kernel matrix already runs 10.6, and it cannot see this HTTP
  # path. The full functional suite stays on Drupal 11 (a 10.6 BrowserTestBase
  # of the whole tree was ~31 minutes). This job runs only
  # McpDraftTranslationTest, which holds the revise coverage, on ~10.6.0.
  # PostgreSQL acceptance of the same file is phpunit-functional-pgsql-draft.
  phpunit-functional-d10:
    name: PHPUnit — Functional draft translation (Drupal 10.6, PHP 8.3)
