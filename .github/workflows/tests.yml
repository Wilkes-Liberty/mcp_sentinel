  phpcs:
    name: Drupal coding standards
    needs: changes
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: module

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php8.4-composer
          restore-keys: |
            ${{ runner.os }}-php8.4-composer
            ${{ runner.os }}-composer-

      - name: Install PHPCS + the Drupal standard
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer drupal/coder

      - name: phpcs
        working-directory: module
        run: |
          # The module's own phpcs.xml.dist, not a standard spelled out here.
          # This job used to pass --standard=Drupal,DrupalPractice with its own
          # --extensions list, so the committed ruleset and the enforced one
          # could drift apart invisibly: editing phpcs.xml.dist changed what a
          # developer runs locally and nothing about what CI checked. The
          # drupalcode phpcs job reads the file, so this now asks the same
          # question rather than a similar one.
          #
          # Verified equivalent when this changed: both invocations scanned the
          # same 192 files and both were clean.
          ~/.composer/vendor/bin/phpcs --standard=phpcs.xml.dist -p

  # phpstan and cspell exist on the drupalcode pipeline and, until now, only
  # there. Two of the three linters that went red on d.o had no GitHub gate at
  # all, which is the concrete mechanism behind a branch reading green on
  # GitHub and red on drupal.org — a PR could not see the failure it was
  # causing. Both jobs run the project's own config files, so the two venues
  # check the same thing rather than two similar things.
  phpstan:
    name: PHPStan
    needs: changes
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php8.3-composer
          restore-keys: |
            ${{ runner.os }}-php8.3-composer
            ${{ runner.os }}-composer-

      # phpstan-drupal needs a real Drupal tree to resolve core classes, so
      # this scaffolds the same way the PHPUnit job does. Analysing the module
      # on its own reports hundreds of "class not found" errors and tells you
      # nothing about the module.
      - name: Scaffold a Drupal site
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project "drupal/recommended-project:^11" drupal \
              --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config repositories.mcp_sentinel path ../module
          composer config --json policy.advisories.ignore-id "${COMPOSER_ADVISORY_IGNORE_IDS}"

      - name: Install dependencies
        working-directory: drupal
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          # twig/twig <3.30: see the matrix job. Twig 3.30.0 500s every page.
          retry composer require -W --no-interaction --no-progress \
            "drupal/mcp_sentinel:*@dev" \
            "twig/twig:<3.30.0"
          # The same contrib set the tests enable: phpstan resolves types
          # against these, and a missing one turns a real error into a
          # "class not found" that hides it.
          retry composer require -W --dev --no-interaction --no-progress \
            "drupal/core-dev:^11" \
            "phpstan/phpstan:^2" \
            "phpstan/extension-installer:^1.4" \
            "mglaman/phpstan-drupal:^2" \
            "phpstan/phpstan-deprecation-rules:^2" \
            "drush/drush:^13" \
            "drupal/redirect:^1.10" "drupal/graphql_compose:^2.4" "drupal/mcp_server:^2.0@dev" \
            "drupal/paragraphs:^1.18" "drupal/entity_reference_revisions:^1.11" \
            "drupal/entity_usage:^2 || ^5" \
            "drupal/content_lock:^3.0" \
            "drupal/scheduler:^2.1" "drupal/scheduler_content_moderation_integration:^3.0"
          bash ../module/.github/ci/refresh-latest-contrib.sh

      - name: Confirm the working copy is what is under test
        working-directory: drupal
        run: |
          test -L web/modules/contrib/mcp_sentinel \
            || { echo "::error::mcp_sentinel is not symlinked to the working copy — the path repo did not apply"; exit 1; }
          readlink web/modules/contrib/mcp_sentinel

      - name: phpstan
        working-directory: drupal
        run: |
          set -euo pipefail
          # The module's own phpstan.neon.dist, so this and the drupalcode
          # phpstan job answer the same question.
          vendor/bin/phpstan analyze web/modules/contrib/mcp_sentinel \
            -c web/modules/contrib/mcp_sentinel/phpstan.neon.dist \
            --autoload-file=vendor/autoload.php \
            --no-progress \
            --memory-limit=2G

          composer require --dev --no-interaction --no-progress \
            phpstan/phpstan-strict-rules:^2
          vendor/bin/phpstan analyze \
            -c web/modules/contrib/mcp_sentinel/phpstan.operator.neon \
            --autoload-file=vendor/autoload.php \
            --no-progress \
            --memory-limit=2G

  # Stays on for docs-only changes. Spellcheck is the cheap check that still
  # applies once the matrix is skipped.
  cspell:
    name: cspell
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the module
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # .cspell.json alone is NOT what drupalcode runs. Its cspell job first
      # rewrites the config via gitlab_templates' scripts/prepare-cspell.php,
      # which layers in Drupal core's two dictionaries plus a fixed list of
      # cspell's built-in ones. Without them, `isset`, `endfor`, `phar` and
      # `fputcsv` all read as misspellings: running the bare project config
      # here reported 21 issues that d.o does not have.
      #
      # A gate that cries wolf is worse than no gate, so this mirrors that
      # preparation instead of approximating it. It is a reimplementation of
      # someone else's script and can drift — if this job and the d.o cspell
      # job ever disagree, the d.o job is right and this one needs re-syncing
      # against prepare-cspell.php.
      #
      # Binary and dictionary versions matter as much as the config. d.o
      # runs Drupal core's locked cspell 9.8.0 with
      # @cspell/dict-software-terms 5.2.2 (11.x yarn.lock). `npx cspell@8`
      # (and even `npx cspell@9.8.0`) resolves software-terms 5.4.8, which
      # added GHSA. That is why this job stayed green on ec74d80 while d.o
      # job 13225039 failed six times on that word.
      - name: Assemble the dictionary set drupalcode uses
        env:
          CORE_BRANCH: '11.x'
        run: |
          set -euo pipefail
          mkdir -p .cspell-ci
          for d in drupal-dictionary dictionary; do
            curl -sfL --retry 3 \
              "https://git.drupalcode.org/project/drupal/-/raw/${CORE_BRANCH}/core/misc/cspell/${d}.txt" \
              -o ".cspell-ci/${d}.txt"
          done
          wc -l .cspell-ci/*.txt

          python3 - <<'PY'
          import json, os
          cfg = json.load(open('.cspell.json'))
          # The list in gitlab_templates/scripts/prepare-cspell.php.
          builtin = ['companies', 'fonts', 'html', 'php', 'softwareTerms', 'misc',
                     'typescript', 'node', 'css', 'bash', 'filetypes', 'npm',
                     'lorem-ipsum', 'sql', 'fullstack']
          core = ['drupal-dictionary', 'dictionary']
          cfg['dictionaries'] = list(dict.fromkeys(
              cfg.get('dictionaries', []) + builtin + core))
          cfg['dictionaryDefinitions'] = [
              {'name': n, 'path': os.path.abspath(f'.cspell-ci/{n}.txt')} for n in core
          ] + cfg.get('dictionaryDefinitions', [])
          # Keep the project dictionary's relative path resolvable: the merged
          # config is written to the repo root, same as .cspell.json.
          json.dump(cfg, open('.cspell-ci.json', 'w'), indent=2)
          print('dictionaries:', ', '.join(cfg['dictionaries']))
          PY

      - name: cspell
        run: |
          set -euo pipefail
          npm install --prefix .cspell-ci --no-save --silent \
            cspell@9.8.0 @cspell/dict-software-terms@5.2.2
          .cspell-ci/node_modules/.bin/cspell lint -c .cspell-ci.json \
            --no-progress --show-suggestions --show-context \
            --exclude '.cspell-ci/**' --exclude '.cspell-ci.json' \
            .

