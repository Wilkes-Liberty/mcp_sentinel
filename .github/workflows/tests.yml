          module="${PWD}/web/modules/contrib/mcp_sentinel"
          status=0
          vendor/bin/phpunit -c "${config}" \
            "${module}/tests/src/Kernel/McpUpdateHookChainTest.php" \
            --filter 'testUpdate10037ResetsUidsAndKeepsFreezes|testUpdate10036Then10037RunsInOrder' \
            || status=1
          vendor/bin/phpunit -c "${config}" \
            "${module}/tests/src/Kernel/McpKillSwitchTest.php" \
            --filter 'testUidUniqueIndexRejectsDuplicate|testBindSecondIdentityOnSameUidConflicts|testComposedOverlongDelegatedTokenIsDeniedAndAudited' \
            || status=1
          vendor/bin/phpunit -c "${config}" \
            "${module}/tests/src/Kernel/McpPrincipalContextDispatchTest.php" \
            --filter 'testOverlongComposedPrincipalKeyWritesOneDeniedAccessRow' \
            || status=1
          vendor/bin/phpunit -c "${config}" \
            "${module}/tests/src/Kernel/McpAuditLoggerTest.php" \
            --filter 'testOversizedEntityIdIsHashedAndStillWritten|testEntityIdAtColumnLimitIsUnchanged' \
            || status=1
          exit "${status}"

