name: Tests

# Runs the PHPUnit suite on every PR and on push to 1.x.
#
# Until this existed, nothing ran the tests: a PR could go green, merge, and
# ship while the suite was broken, and the only thing between a regression and a
# release was whoever remembered to run PHPUnit by hand. For a module whose job
# is enforcing a security boundary, that is the wrong guarantee — see issue #32.
#
# Unit + Kernel run across the support matrix; Functional runs as its own
# blocking job on the ceiling leg (#58). One functional leg is a deliberate
# cost/coverage trade: the drupalcode GitLab pipeline still runs the full
# suite per push to 1.x and per release commit, and 1.12.0 proved a
# GitHub-only green is not a release gate — the JSON:API publish-gate fix
# shipped inert because only the functional suite could see it.
on:
  pull_request: { branches: ['**'] }
  push: { branches: ['1.x'] }

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (Drupal ${{ matrix.drupal }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      # Report every combination: a failure on one core version is a real
      # result, not a reason to hide the other.
      fail-fast: false
      matrix:
        include:
          # The floor of each declared range, plus the ceiling
          # (^10.6 || ^11.3).
          #
          # Support the oldest branch upstream still supports, not the one we
          # happen to run: orgs upgrade slowly and a narrow floor discourages
          # adoption. But "supported upstream" is the test — an EOL branch is
          # not a kindness to claim, it is a lie. Per endoflife.date on
          # 2026-07-16 the only live branches are 10.6 and 11.3 (both EOL
          # 2026-12-16) and 11.4 (EOL 2027-07-07). 11.0/11.1/11.2 are dead,
          # which is why the 11 floor is 11.3 and not ^11.
          #
          # Every floor gets a leg, because a claim CI does not exercise is not
          # a claim. That is not theoretical: 11.0 and 11.1 sat inside a
          # released ^11 for versions, and the module fataled on both — nobody
          # noticed, because the only leg ran 11.4.
          #
          # Recheck when 10.6/11.3 go EOL on 2026-12-16.
          #
          # `constraint` is spelled out per leg rather than derived from
          # `drupal`, because the obvious derivation is wrong: ^11.3 means
          # ">=11.3 <12" and resolves to 11.4, so an "11.3" leg built that way
          # silently retests the ceiling. It went green doing exactly that
          # before the version probe printed "Drupal core: 11.4.4" underneath
          # the words "Drupal 11.3". A floor leg pins its minor (~11.3.0); the
          # ceiling leg deliberately floats (^11).
          #
          # phpunit is pinned per leg. Drupal 10's core-dev hard-requires ^9.6,
          # and 9.6 predates PHP 8 attributes: it does not error on one it
          # cannot read, it ignores it. That is why the suite also carries
          # annotations (@group, @dataProvider, @runTestsInSeparateProcesses)
          # alongside its attributes — 9.6 reads the annotations, 10/11 read the
          # attributes, and this leg is what keeps the pair honest. Drop the
          # annotations and 9.6 stops expanding the data providers: the Unit
          # directory alone falls from 62 tests to 53, without erroring.
          #
          # Both PHPUnit versions must therefore report the *same* test count.
          # That equality is the whole point of this leg, and it is asserted by
          # the count floor in the PHPUnit step rather than trusted — a green
          # check has already twice meant "ran almost nothing" here.
          - drupal: '10.6'
            constraint: '~10.6.0'
            php: '8.3'
            phpunit: '^9.6'
          - drupal: '11.3'
            constraint: '~11.3.0'
            php: '8.3'
            phpunit: '^11.5'
          - drupal: '11'
            constraint: '^11'
            php: '8.4'
            phpunit: '^11.5'

    steps:
      - name: Checkout the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gd: image module. pdo_sqlite/sqlite3: the kernel-test database.
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Scaffold a Drupal site
        env:
          DRUPAL_CONSTRAINT: ${{ matrix.constraint }}
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project "drupal/recommended-project:${DRUPAL_CONSTRAINT}" drupal \
              --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          # Some deps are dev-stability (mcp_server is ^2.0@dev).
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          # Install the working copy, not the released package.
          composer config repositories.mcp_sentinel path ../module
          # CVE-2026-53965 (PKSA-p9gd-j6gr-6f9t) is in mcp/sdk's CLIENT
          # HttpTransport SSE buffering; this scaffold uses the SDK only as
          # the server side of drupal/mcp_server, so the vulnerable class is
          # never instantiated. mcp_server pins ^0.6, which cannot reach the
          # 0.7.1 fix — drop this ignore once upstream allows ^0.7.
          composer config --json policy.advisories.ignore-id '["PKSA-p9gd-j6gr-6f9t"]'

      - name: Install dependencies
        working-directory: drupal
        env:
          DRUPAL_CONSTRAINT: ${{ matrix.constraint }}
          PHPUNIT_VERSION: ${{ matrix.phpunit }}
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          # -W (--with-all-dependencies) on both: recommended-project ships a
          # composer.lock, so each require is a *partial* update and composer
          # refuses to move transitive packages the lock pins — core-dev wants
          # phpunit, phpunit wants sebastian/diff ^6, the lock says 7.0.0, and
          # resolution fails. -W lets it move them.
          retry composer require -W --no-interaction --no-progress \
            "drupal/mcp_sentinel:*@dev"
          # core-dev brings PHPUnit; drush because the module ships Drush
          # commands whose tests instantiate them (they extend
          # Drush\Commands\DrushCommands); the rest are the contrib modules the
          # tests enable, mirroring the module's own require-dev.
          retry composer require -W --dev --no-interaction --no-progress \
            "drupal/core-dev:${DRUPAL_CONSTRAINT}" \
            "phpunit/phpunit:${PHPUNIT_VERSION}" \
            "drush/drush:^13" \
            "drupal/redirect:^1.10" "drupal/graphql_compose:^2.4" "drupal/mcp_server:^2.0@dev" \
            "drupal/paragraphs:^1.18" "drupal/entity_reference_revisions:^1.11"

      - name: Assert the versions actually under test
        working-directory: drupal
        env:
          EXPECTED_DRUPAL: ${{ matrix.drupal }}
        run: |
          set -euo pipefail
          # require the autoloader inline: php ignores auto_prepend_file for -r
          # code, so loading it that way leaves Composer\InstalledVersions
          # undefined and the line fatals after echoing its label. With the
          # `|| true` this step used to carry, that fatal was invisible and the
          # next command's output landed on the "Drupal core:" line — so the
          # step confidently reported PHPUnit's version as Drupal's. No `|| true`
          # here: a probe that cannot answer must fail, not improvise.
          core="$(php -r 'require "vendor/autoload.php"; echo \Composer\InstalledVersions::getPrettyVersion("drupal/core");')"
          echo "Drupal core: ${core}"
          vendor/bin/phpunit --version
          vendor/bin/drush --version || true

          # Assert, do not merely print. A leg named "11.3" resolved and tested
          # 11.4.4 and went green: ^11.3 means ">=11.3 <12", so the floor leg
          # quietly retested the ceiling and the range it existed to protect was
          # covered by nothing. Printing the resolved version had already caught
          # it — but only because a human happened to read the line. Checking it
          # is what makes the leg mean what its name says.
          case "${core}" in
            "${EXPECTED_DRUPAL}".*) ;;
            *) echo "::error::Leg claims Drupal ${EXPECTED_DRUPAL} but resolved ${core}. The leg is testing a version it does not name — fix matrix.constraint rather than this check."; exit 1 ;;
          esac

      - name: Confirm the working copy is what is under test
        working-directory: drupal
        run: |
          # A path repo can silently fall back to the registry package; if that
          # happened the suite would pass against code nobody changed.
          test -L web/modules/contrib/mcp_sentinel \
            || { echo "::error::mcp_sentinel is not symlinked to the working copy — the path repo did not apply"; exit 1; }
          readlink web/modules/contrib/mcp_sentinel

      - name: PHPUnit — Unit + Kernel (blocking)
        working-directory: drupal
        env:
          # Kernel tests need a database; SQLite keeps this hermetic with no
          # service container. Production runs PostgreSQL, so a storage-specific
          # regression would not surface here — the functional job below and
          # the drupalcode pipeline are the deeper nets.
          # Quoted: the value ends in a colon, which YAML would otherwise read
          # as a mapping key and refuse to parse the file at all.
          SIMPLETEST_DB: 'sqlite://localhost/:memory:'
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp
          SYMFONY_DEPRECATIONS_HELPER: weak
          # A dropped suite must fail the build, not pass quietly. See the count
          # guard below.
          #
          # 564 collect today: 110 Unit + 393 Kernel in the top-level module,
          # plus 26 (approval) + 17 (graphql) + 7 + 14 (server) in the
          # submodules. The floor sits just under that, so losing any one
          # submodule suite — the smallest is 7 tests — trips it.
          MIN_TESTS: '556'
        run: |
          set -euo pipefail
          # One invocation per directory: PHPUnit 9.6 takes a *single*
          # <directory|file> argument, while 10+ accept a list. Passing both
          # paths did not error on 9.6 — it ran tests/src/Unit, ignored
          # tests/src/Kernel, and reported "OK (62 tests)". Green, on 17% of the
          # suite.
          # Absolute -c path: the Kernel tests declare
          # @runTestsInSeparateProcesses, and a child process does not inherit
          # this working directory. PHPUnit 11 resolves a relative config path
          # before handing it down; 9.6 passes it through, so every child died
          # on `Could not read "web/core/phpunit.xml.dist"`.
          config="${PWD}/web/core/phpunit.xml.dist"
          module="${PWD}/web/modules/contrib/mcp_sentinel"

          # The submodules' own tests are collected too. Until this loop existed
          # the step ran the top-level tests/src only, so mcp_sentinel_approval,
          # _graphql and _server had NO gate on GitHub at all — and the count
          # floor could not notice, because it was computed over the same two
          # directories it was guarding. The drupalcode pipeline runs the whole
          # tree, which is exactly how "GitHub green, d.o red" kept happening.
          # A break-glass expiry defect lived in that gap and ran nowhere.
          #
          # Discovered rather than listed, so a submodule added later is tested
          # without anyone remembering to edit this file.
          suites=()
          for dir in "${module}"/tests/src/Unit "${module}"/tests/src/Kernel \
                     "${module}"/modules/*/tests/src/Unit "${module}"/modules/*/tests/src/Kernel; do
            [ -d "${dir}" ] && suites+=("${dir}")
          done
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::error::No test directories found under ${module}. The path is wrong, or the checkout is not what it should be."
            exit 1
          fi

          i=0
          for dir in "${suites[@]}"; do
            i=$((i + 1))
            echo "--- ${dir#"${module}/"}"
            vendor/bin/phpunit -c "${config}" \
              --log-junit "${PWD}/junit-${i}.xml" \
              "${dir}"
          done

          # Assert the *count*, not the exit status. Both failures this workflow
          # has already shipped — a matrix leg that scheduled zero jobs, and a
          # runner that silently collected 62 of 364 tests — were green. An exit
          # code only says the tests that ran passed; it cannot say which ran.
          # JUnit XML is used because its shape is stable across 9.6 and 11,
          # unlike the human-readable summary line.
          total="$(cat junit-*.xml | grep -ho '<testcase ' | wc -l | tr -d ' ')"
          echo "Collected ${total} tests across ${#suites[@]} directories (floor ${MIN_TESTS})."
          if [ "${total}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Collected only ${total} tests, below the floor of ${MIN_TESTS}. The suite was dropped, not fixed — a passing run on a partial suite is a false green. Investigate before raising or removing this floor."
            exit 1
          fi

  # Functional (BrowserTestBase) suite on the ceiling leg only. The setup
  # steps deliberately mirror the matrix job above rather than sharing a
  # composite action: the two jobs pin different things (the matrix pins
  # floors and PHPUnit 9.6 quirks; this job pins the webserver contract) and
  # coupling their evolution has already cost more than the duplication.
  # BrowserTestBase needs a real webserver serving the docroot and a real
  # SQLite file (the tested site runs in the server process, so :memory: is
  # not shared); PHP's built-in server with core's .ht.router.php is the
  # documented minimal setup. Added by #58 after 1.12.0 shipped a fix the
  # kernel suite could not see fail.
  phpunit-functional:
    name: PHPUnit — Functional (Drupal 11, PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # gd: image module. pdo_sqlite/sqlite3: the test database. curl/dom:
          # BrowserTestBase's Mink driver and response parsing.
          extensions: gd, pdo_sqlite, sqlite3, curl, dom
          coverage: none

      - name: Scaffold a Drupal site
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project "drupal/recommended-project:^11" drupal \
              --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config repositories.mcp_sentinel path ../module
          # CVE-2026-53965 (PKSA-p9gd-j6gr-6f9t) is in mcp/sdk's CLIENT
          # HttpTransport SSE buffering; this scaffold uses the SDK only as
          # the server side of drupal/mcp_server, so the vulnerable class is
          # never instantiated. mcp_server pins ^0.6, which cannot reach the
          # 0.7.1 fix — drop this ignore once upstream allows ^0.7.
          composer config --json policy.advisories.ignore-id '["PKSA-p9gd-j6gr-6f9t"]'

      - name: Install dependencies
        working-directory: drupal
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          retry composer require -W --no-interaction --no-progress \
            "drupal/mcp_sentinel:*@dev"
          retry composer require -W --dev --no-interaction --no-progress \
            "drupal/core-dev:^11" \
            "phpunit/phpunit:^11.5" \
            "drush/drush:^13" \
            "drupal/redirect:^1.10" "drupal/graphql_compose:^2.4" "drupal/mcp_server:^2.0@dev" \
            "drupal/paragraphs:^1.18" "drupal/entity_reference_revisions:^1.11"

      - name: Confirm the working copy is what is under test
        working-directory: drupal
        run: |
          test -L web/modules/contrib/mcp_sentinel \
            || { echo "::error::mcp_sentinel is not symlinked to the working copy — the path repo did not apply"; exit 1; }
          readlink web/modules/contrib/mcp_sentinel

      - name: Start the test webserver
        working-directory: drupal
        run: |
          mkdir -p web/sites/simpletest/browser_output web/sites/default/files
          chmod -R 777 web/sites
          # ABSOLUTE paths for docroot and router: the built-in server
          # resolves the router path per-request against its runtime working
          # directory, which is not the launch directory — a relative path
          # fatals on 'Failed opening required web/.ht.router.php' at request
          # time, every child-site page dies, and the suite fails 96 tests
          # with misleading login/status errors while the startup probe
          # (served before the fatal) still passes.
          nohup php -S 127.0.0.1:8888 -t "${PWD}/web" "${PWD}/web/.ht.router.php" > /tmp/php-server.log 2>&1 &
          # The probe must prove the server answers before tests assume it; a
          # dead server fails every test with a curl error that reads like a
          # product bug.
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8888/core/misc/drupal.js > /dev/null && exit 0
            sleep 0.5
          done
          echo "::error::test webserver never answered"; cat /tmp/php-server.log; exit 1

      - name: PHPUnit — Functional (blocking)
        working-directory: drupal
        env:
          # A real file, not :memory: — the tested site runs inside the
          # webserver process and must see the same database.
          SIMPLETEST_DB: 'sqlite://localhost/sites/default/files/test.sqlite'
          SIMPLETEST_BASE_URL: 'http://127.0.0.1:8888'
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp
          SYMFONY_DEPRECATIONS_HELPER: weak
          # Same doctrine as the matrix job: assert the count, not the exit
          # status. 22 files / 104 test methods today; the floor catches a
          # dropped directory, not normal drift.
          MIN_TESTS: '60'
        run: |
          set -euo pipefail
          config="${PWD}/web/core/phpunit.xml.dist"
          vendor/bin/phpunit -c "${config}" \
            --log-junit "${PWD}/junit-Functional.xml" \
            "${PWD}/web/modules/contrib/mcp_sentinel/tests/src/Functional" \
            "${PWD}/web/modules/contrib/mcp_sentinel/modules/mcp_sentinel_approval/tests/src/Functional"
          total="$( (grep -ho '<testcase ' junit-Functional.xml || true) | wc -l | tr -d ' ')"
          echo "Collected ${total} functional tests (floor ${MIN_TESTS})."
          if [ "${total}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Collected only ${total} functional tests, below the floor of ${MIN_TESTS}. The suite was dropped, not fixed."
            exit 1
          fi

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: functional-failure-evidence
          path: |
            /tmp/php-server.log
            /tmp/*.html
          if-no-files-found: ignore

  phpcs:
    name: Drupal coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: module

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHPCS + the Drupal standard
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer drupal/coder

      - name: phpcs
        working-directory: module
        run: |
          # The module's own phpcs.xml.dist, not a standard spelled out here.
          # This job used to pass --standard=Drupal,DrupalPractice with its own
          # --extensions list, so the committed ruleset and the enforced one
          # could drift apart invisibly: editing phpcs.xml.dist changed what a
          # developer runs locally and nothing about what CI checked. The
          # drupalcode phpcs job reads the file, so this now asks the same
          # question rather than a similar one.
          #
          # Verified equivalent when this changed: both invocations scanned the
          # same 192 files and both were clean.
          ~/.composer/vendor/bin/phpcs --standard=phpcs.xml.dist -p

  # phpstan and cspell exist on the drupalcode pipeline and, until now, only
  # there. Two of the three linters that went red on d.o had no GitHub gate at
  # all, which is the concrete mechanism behind a branch reading green on
  # GitHub and red on drupal.org — a PR could not see the failure it was
  # causing. Both jobs run the project's own config files, so the two venues
  # check the same thing rather than two similar things.
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none

      # phpstan-drupal needs a real Drupal tree to resolve core classes, so
      # this scaffolds the same way the PHPUnit job does. Analysing the module
      # on its own reports hundreds of "class not found" errors and tells you
      # nothing about the module.
      - name: Scaffold a Drupal site
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project "drupal/recommended-project:^11" drupal \
              --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config repositories.mcp_sentinel path ../module
          # CVE-2026-53965 (PKSA-p9gd-j6gr-6f9t) is in mcp/sdk's CLIENT
          # HttpTransport SSE buffering; this scaffold uses the SDK only as
          # the server side of drupal/mcp_server, so the vulnerable class is
          # never instantiated. mcp_server pins ^0.6, which cannot reach the
          # 0.7.1 fix — drop this ignore once upstream allows ^0.7.
          composer config --json policy.advisories.ignore-id '["PKSA-p9gd-j6gr-6f9t"]'

      - name: Install dependencies
        working-directory: drupal
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          retry composer require -W --no-interaction --no-progress \
            "drupal/mcp_sentinel:*@dev"
          # The same contrib set the tests enable: phpstan resolves types
          # against these, and a missing one turns a real error into a
          # "class not found" that hides it.
          retry composer require -W --dev --no-interaction --no-progress \
            "drupal/core-dev:^11" \
            "phpstan/phpstan:^2" \
            "phpstan/extension-installer:^1.4" \
            "mglaman/phpstan-drupal:^2" \
            "phpstan/phpstan-deprecation-rules:^2" \
            "drush/drush:^13" \
            "drupal/redirect:^1.10" "drupal/graphql_compose:^2.4" "drupal/mcp_server:^2.0@dev" \
            "drupal/paragraphs:^1.18" "drupal/entity_reference_revisions:^1.11"

      - name: Confirm the working copy is what is under test
        working-directory: drupal
        run: |
          test -L web/modules/contrib/mcp_sentinel \
            || { echo "::error::mcp_sentinel is not symlinked to the working copy — the path repo did not apply"; exit 1; }
          readlink web/modules/contrib/mcp_sentinel

      - name: phpstan
        working-directory: drupal
        run: |
          set -euo pipefail
          # The module's own phpstan.neon.dist, so this and the drupalcode
          # phpstan job answer the same question.
          vendor/bin/phpstan analyze web/modules/contrib/mcp_sentinel \
            -c web/modules/contrib/mcp_sentinel/phpstan.neon.dist \
            --autoload-file=vendor/autoload.php \
            --no-progress \
            --memory-limit=2G

  cspell:
    name: cspell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the module
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # .cspell.json alone is NOT what drupalcode runs. Its cspell job first
      # rewrites the config via gitlab_templates' scripts/prepare-cspell.php,
      # which layers in Drupal core's two dictionaries plus a fixed list of
      # cspell's built-in ones. Without them, `isset`, `endfor`, `phar` and
      # `fputcsv` all read as misspellings: running the bare project config
      # here reported 21 issues that d.o does not have.
      #
      # A gate that cries wolf is worse than no gate, so this mirrors that
      # preparation instead of approximating it. It is a reimplementation of
      # someone else's script and can drift — if this job and the d.o cspell
      # job ever disagree, the d.o job is right and this one needs re-syncing
      # against prepare-cspell.php.
      - name: Assemble the dictionary set drupalcode uses
        env:
          CORE_BRANCH: '11.x'
        run: |
          set -euo pipefail
          mkdir -p .cspell-ci
          for d in drupal-dictionary dictionary; do
            curl -sfL --retry 3 \
              "https://git.drupalcode.org/project/drupal/-/raw/${CORE_BRANCH}/core/misc/cspell/${d}.txt" \
              -o ".cspell-ci/${d}.txt"
          done
          wc -l .cspell-ci/*.txt

          python3 - <<'PY'
          import json, os
          cfg = json.load(open('.cspell.json'))
          # The list in gitlab_templates/scripts/prepare-cspell.php.
          builtin = ['companies', 'fonts', 'html', 'php', 'softwareTerms', 'misc',
                     'typescript', 'node', 'css', 'bash', 'filetypes', 'npm',
                     'lorem-ipsum', 'sql', 'fullstack']
          core = ['drupal-dictionary', 'dictionary']
          cfg['dictionaries'] = list(dict.fromkeys(
              cfg.get('dictionaries', []) + builtin + core))
          cfg['dictionaryDefinitions'] = [
              {'name': n, 'path': os.path.abspath(f'.cspell-ci/{n}.txt')} for n in core
          ] + cfg.get('dictionaryDefinitions', [])
          # Keep the project dictionary's relative path resolvable: the merged
          # config is written to the repo root, same as .cspell.json.
          json.dump(cfg, open('.cspell-ci.json', 'w'), indent=2)
          print('dictionaries:', ', '.join(cfg['dictionaries']))
          PY

      - name: cspell
        run: |
          set -euo pipefail
          npx --yes cspell@8 lint -c .cspell-ci.json \
            --no-progress --show-suggestions --show-context \
            --exclude '.cspell-ci/**' --exclude '.cspell-ci.json' \
            .
