name: Changelog
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  changelog:
    name: CHANGELOG updated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG.md entry
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog')
                && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
          else
            echo "::error::This PR does not update CHANGELOG.md. Add an entry under [Unreleased], or apply the 'no-changelog' label for trivial PRs."
            exit 1
          fi
