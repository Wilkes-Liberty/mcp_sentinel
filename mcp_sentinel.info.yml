name: 'MCP Sentinel'
type: module
description: 'Enterprise governance for AI-agent access to Drupal — policy profiles, field redaction, DLP, tamper-evident audit logging, and reliable webhooks over MCP / JSON:API / GraphQL.'
package: 'AI / MCP'
core_version_requirement: ^10.6 || ^11.3

# Hard dependencies — modules whose APIs we call directly in PHP.
dependencies:
  - audit_chain:audit_chain
  - drupal:user
  - drupal:node
  - drupal:jsonapi
  - tool:tool (>=1.0.0-beta8)
  - key:key
  - simple_oauth:simple_oauth
  - consumers:consumers
  - encrypt:encrypt

# drupal/mcp_server: strongly recommended (exposes Tool plugins to MCP clients)
# but NOT required — security, audit, content locks, and webhooks all work without it.
# drupal/ai: NOT a dependency. Different problem space.
# drupal/content_lock: optional. When present, a human's entity-form lock is a
# governed write conflict. Listed as a test dependency so that consult is
# covered on the d.o pipeline.
# drupal/scheduler_content_moderation_integration: optional. When present, the
# policy profile decides governed scheduled publishing. Test dependency for the
# same reason.

test_dependencies:
  - content_lock:content_lock
  - scheduler:scheduler
  - scheduler_content_moderation_integration:scheduler_content_moderation_integration

configure: mcp_sentinel.settings
