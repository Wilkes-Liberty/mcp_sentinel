################
# Drupal GitLabCI template for contrib modules.
#
# Replicates DrupalCI testing via the centrally maintained include files.
# https://www.drupal.org/docs/develop/git/using-gitlab-to-contribute-to-drupal
################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  _GITLAB_TEMPLATES_REPO: project/gitlab_templates
  _GITLAB_TEMPLATES_REF: main
  # This module declares `^10.6 || ^11.3`, but the default phpunit job runs
  # against current core only — so neither floor was ever exercised and the
  # green badge did not mean what it appeared to. OPT_IN_* surfaces the job;
  # _AUTORUN_* ('all') makes it run instead of waiting for someone to press it.
  #
  # PREVIOUS_MINOR = prior minor of the current major (11.3, the D11 floor).
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  # Forward-compat signal on the upcoming minor, available on demand.
  OPT_IN_TEST_NEXT_MINOR: '1'
  #
  # PREVIOUS_MAJOR (Drupal 10.6, the D10 floor) is deliberately OFF here, and
  # the Drupal 10.6 support claim is unchanged — read on before switching it
  # back on.
  #
  # The lane cannot build in this image, for a reason no CI setting reaches.
  # drupal/simple_oauth ^6.1 pulls league/oauth2-server ^9.0, which pulls
  # lcobucci/jwt ^5.0; every jwt line in that range either requires ext-sodium
  # or caps at PHP 8.2:
  #
  #   lcobucci/jwt[4.1.0..4.4.x, 5.1.0..5.6.x] require ext-sodium -> missing
  #   lcobucci/jwt[5.0.0..5.0.x]  require php ~8.1.0 || ~8.2.0 -> php 8.3.32
  #
  # The drupalci image ships no ext-sodium, so there is no resolvable point in
  # the lane at all. The one setting that would make it "pass" is
  # --ignore-platform-req=ext-sodium, which builds an environment whose crypto
  # stack matches no real site — green for the wrong reason, which is the
  # failure mode this pipeline exists to prevent.
  #
  # ^10.6 stays verified, on GitHub Actions: .github/workflows/tests.yml runs a
  # `drupal: '10.6'` leg (pinned ~10.6.0, PHP 8.3, PHPUnit ^9.6) that passes.
  # This moves WHERE the claim is checked; it does not narrow the claim. Per the
  # support policy a claim CI does not exercise is not a claim, and that
  # obligation is still met.
  #
  # Missing ext-sodium is filed upstream against project/gitlab_templates. Turn
  # this lane back on once the image carries it.
  # OPT_IN_TEST_PREVIOUS_MAJOR: '1'
  # _AUTORUN_PREVIOUS_MAJOR: 'all'

################
# Project overrides
################

# Nothing overridden. The `composer (previous major)` PHP_VERSION: '8.3' pin
# that used to live here worked -- it did get the lane onto PHP 8.3 instead of
# Drupal 10's minimum 8.1 (#3613940) -- and then the lane failed one layer
# down, on the missing extension described above. With the lane off, the pin
# has nothing to pin.
#
# On the PHP floor, which an earlier version of this comment got wrong: >=8.3
# is not a CI convenience, it is what the code requires. Two independent
# reasons, either one sufficient on its own:
#
#  - drupal/simple_oauth ^6.1 is a RUNTIME requirement, not a test-only one. It
#    pulls league/oauth2-server and lcobucci/jwt, both declaring
#    php: ~8.2.0 || ~8.3.0 || ~8.4.0 || ~8.5.0. PHP 8.1 does not resolve.
#  - The module uses typed class constants (public const string NAME = ...),
#    which are PHP 8.3 syntax. Below 8.3 that is a parse error -- the module
#    cannot load, never mind install.
#
# So the open question is 8.2 versus 8.3, not 8.1 versus 8.3. Reaching 8.2
# would mean dropping those type declarations, while Drupal 11.3 -- this
# module's D11 floor -- requires 8.3 regardless. Tracked, not settled here.
#
# One limit stays recorded rather than hidden: drupal/mcp_server sits in
# require-dev and needs PHP ^8.3, so the mcp_sentinel_server tests could not
# run below 8.3 on any venue even if the rest of the module could.
