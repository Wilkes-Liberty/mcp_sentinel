################
# Drupal GitLabCI template for contrib modules.
#
# Replicates DrupalCI testing via the centrally maintained include files.
# https://www.drupal.org/docs/develop/git/using-gitlab-to-contribute-to-drupal
################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  _GITLAB_TEMPLATES_REPO: project/gitlab_templates
  _GITLAB_TEMPLATES_REF: main
  # This module declares `^10.6 || ^11.3`, but the default phpunit job runs
  # against current core only — so neither floor was ever exercised and the
  # green badge did not mean what it appeared to. OPT_IN_* surfaces the job;
  # _AUTORUN_* ('all') makes it run instead of waiting for someone to press it.
  #
  # PREVIOUS_MAJOR = newest 10.x satisfying the constraint (10.6, the D10 floor).
  # PREVIOUS_MINOR = prior minor of the current major (11.3, the D11 floor).
  OPT_IN_TEST_PREVIOUS_MAJOR: '1'
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MAJOR: 'all'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  # Forward-compat signal on the upcoming minor, available on demand.
  OPT_IN_TEST_NEXT_MINOR: '1'

################
# Project overrides
################

# The previous-major lane is pinned by the shared templates to Drupal 10's
# MINIMUM PHP (PHP_VERSION: $CORE_PREVIOUS_PHP_MIN, currently 8.1). On 8.1 the
# build cannot resolve at all: drupal/mcp_server sits in require-dev and needs
# PHP ^8.3, so composer exits 2 before a single test runs, and phpunit
# (previous major) never even starts. See #3613940.
#
# Drupal 10.6 supports PHP 8.1 through 8.4, so 10.6-on-8.3 is a legitimate and
# representative configuration — and the only one where this suite can build.
# The module's RUNTIME requirements carry no 8.3 constraint; this is a limitation
# of the test build, not of the module.
#
# Two things this deliberately does NOT do, both recorded rather than hidden:
#  - It does not test Drupal 10.6 on PHP 8.1. That combination stays unverified.
#    mcp_server cannot install there at any 2.x version, so the
#    mcp_sentinel_server tests are unrunnable on 8.1 regardless of CI config.
#  - It does not settle whether the supported PHP floor should simply be 8.3.
#    That narrows the support surface and is a maintainer decision, not a CI fix.
composer (previous major):
  variables:
    PHP_VERSION: '8.3'
